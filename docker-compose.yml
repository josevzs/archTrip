services:
  archtrip:
    build: .
    container_name: archtrip
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # contraseña de la página de administración (#/admin); sin esta línea vale "admin"
      - ARCHTRIP_ADMIN_PASSWORD=${ARCHTRIP_ADMIN_PASSWORD:-admin}
      # publicar para los alumnos en Cloudflare Pages (admin → Publicar para los alumnos): se ponen
      # en un archivo .env junto a este, que no entra en git (ver el README)
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
