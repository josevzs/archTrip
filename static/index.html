      body = '<div class="row" style="margin-bottom:8px"><span class="muted small">Cada sesión es un navegador que ha cambiado algo; se cierra tras 1 h sin cambios. Los deshacer también quedan registrados y se pueden volver a deshacer.</span>'
        + '<button class="quiet" data-action="adm-logout">Salir</button></div>'
        + (A.note ? '<div class="msg">' + esc(A.note) + ' <button class="link" data-action="adm-dismiss">cerrar</button></div>' : '')
        + '<h2>Sesiones de edición</h2>' + sessions
        + '<h2>Historial de un hito</h2><form class="row" data-form="admin-search"><input type="search" name="q" class="grow" placeholder="Nombre del hito (o su número)" value="' + attr(A.query) + '"><button type="submit">Buscar</button></form>'
        + (A.history ? (A.history.length ? '<ul class="changes" id="history" style="margin-top:10px">' + A.history.map((c) => changeItem(c, true)).join('') + '</ul>' : '<div class="muted small" style="margin-top:8px">Nada registrado para ese hito.</div>') : '')
        + '<h2>Copias de seguridad</h2><div class="row"><button data-action="adm-backup-now"' + (A.busy ? ' disabled' : '') + '>Crear copia ahora</button>'
        + '<a class="btn quiet" href="/api/admin/export.db">⬇ Volcado SQL de la base actual</a>'
        + '<span class="muted small">Restaurar sustituye TODOS los datos por los de la copia; antes se guarda el estado actual como pre-restore-….db.</span></div>' + backups;
    }
    return '<h1>archTrip <span class="muted" style="font-size:14px;text-transform:none;letter-spacing:0">· administración</span></h1>'
      + '<div class="small" style="margin:6px 0 16px"><a href="#/">← Viajes</a></div><div class="adm">' + body + '</div>';
  }

  const admin = {
    get: (path) => call('GET', '/api/admin' + path),
    post: (path, body) => call('POST', '/api/admin' + path, body === undefined ? {} : body),
    patch: (path, body) => call('PATCH', '/api/admin' + path, body),
  };

  async function loadAdmin() {
    state.screen = 'admin'; state.admin.note = null;
    render();
    try {
      const me = await admin.get('/me');
      state.admin.authed = me.admin;
      if (me.admin) await refreshAdmin();
    } catch (e) { state.admin.authed = false; state.admin.note = e.message; }
    render();
  }

  async function refreshAdmin() {
    const A = state.admin;
    [A.sessions, A.backups] = await Promise.all([admin.get('/sessions'), admin.get('/backups')]);
    if (A.open != null) A.changes = await admin.get('/sessions/' + A.open + '/changes');
    if (A.query) A.history = await admin.get('/changes?landmark=' + q(A.query));
  }

  async function adminDo(fn) {
    const A = state.admin;
    A.busy = true; render();
    try { A.note = await fn(); await refreshAdmin(); }
    catch (e) { A.note = e.message; if (/401/.test(e.message) || /contraseña/i.test(e.message)) A.authed = false; }
    A.busy = false; render();
  }

  // ------------------------------------------------------------ actions
  function say(text, type, list) { state.msg = { text, type: type || 'ok', list: list || [] }; }
  function fail(err) { say(err.message || String(err), 'err', err.details); }

  async function loadTrips() {
    state.screen = 'trips';
    try { state.trips = await store.listTrips(); } catch (e) { fail(e); }
    render();
    if (!STANDALONE && !state.healthChecked) {     // ¿se está entrando desde fuera?
      state.healthChecked = true;
      try {
        const h = await store.health();
        if (h.public !== state.publicView) { state.publicView = !!h.public; if (state.screen === 'trips') render(); }
      } catch (e) { /* da igual: se asume red de casa */ }
    }
  }

  async function loadNewTrip(mode) {
    state.screen = 'new'; state.newMode = mode || null;
    render();
    if (mode === 'ia' && state.promptText == null) {
      try {
        const res = await fetch('/api/templates/prompt.md');
        state.promptText = await res.text();
      } catch (e) { state.promptText = 'No se ha podido cargar el texto. Usa el botón "Descargar .md".'; }
      if (state.screen === 'new') render();
    }
  }

  async function loadTrip(id, keepMsg, openId) {
    try {
      const d = await store.getTrip(id);
      state.trip = d.trip; state.stops = d.stops; state.landmarks = d.landmarks; state.pending = d.pending;
      state.days = d.days || []; sortDays();
      try { state.activeDay = Number(localStorage.getItem('archtrip:day:' + d.trip.id)) || null; } catch (e) { state.activeDay = null; }
      if (!state.days.some((x) => x.id === state.activeDay)) state.activeDay = state.days.length ? state.days[0].id : null;
      state.screen = 'trip';
      if (!keepMsg) state.msg = null;
      state.editing = null; state.detail = null; state.picker = null;
      mapState.map = null; mapState.cluster = null; mapState.fitted = false; mapState.listPopup = null;
      render();
      if (openId && state.landmarks.some((x) => x.id === openId)) openDetail(openId);   // deep link to a ficha
      if (d.pending && d.pending.total > 0) runEnrich();
    } catch (e) {
      fail(e); state.screen = 'trips'; render();
    }
  }

  // Keep the address bar pointing at the open ficha so a link can be shared (#/viaje/T/hito/L).
  function syncHash() {
    if (STANDALONE || !state.trip) return;
    const want = '#/viaje/' + state.trip.id + (state.detail != null ? '/hito/' + state.detail : '');
    if (location.hash !== want) history.replaceState(null, '', want);
  }

  function applyLandmark(lm) {
    const i = state.landmarks.findIndex((x) => x.id === lm.id);
    if (i >= 0) state.landmarks[i] = lm; else state.landmarks.push(lm);
  }

  async function runEnrich() {
    if (STANDALONE || state.enrich.running || !state.trip) return;
    const tripId = state.trip.id;
    state.enrich = { running: true, remaining: state.pending ? state.pending.total : 0, total: state.pending ? state.pending.total : 0, error: null };
    document.getElementById('progress').innerHTML = progressView();
    try {
      for (;;) {
        const r = await store.enrichNext(tripId);
        if (state.screen !== 'trip' || !state.trip || state.trip.id !== tripId) return;
        state.enrich.remaining = r.remaining;
        if (r.counts) state.pending = r.counts;
        if (r.error) { state.enrich.error = r.error; break; }
        if (r.landmark) { applyLandmark(r.landmark); patchCard(r.landmark); }
        if (r.stop) { const i = state.stops.findIndex((s) => s.id === r.stop.id); if (i >= 0) state.stops[i] = r.stop; document.getElementById('route').innerHTML = routeView(); }
        document.getElementById('progress').innerHTML = progressView();
        if (r.done || !r.item) break;
      }
    } catch (e) {
      state.enrich.error = e.message || 'Error de conexión';
    } finally {
      state.enrich.running = false;
      if (state.screen === 'trip') renderList();
    }
  }

  async function upload(kind, file) {
    if (!file) return;
    say('Leyendo ' + file.name + '…');
    renderList();
    try {
      const r = await store.upload(kind, state.trip.id, file);
      const text = kind === 'route' ? r.added + ' paradas cargadas.'
        : kind === 'paseos' ? r.added + ' paseos nuevos, ' + r.updated + ' actualizados.'
        : r.added + ' hitos nuevos, ' + r.updated + ' actualizados.'
          + (r.walks ? ' (' + r.walks + ' son paseos con recorrido)' : '');
      say(text + (r.errors && r.errors.length ? ' Filas con problemas:' : ''), r.errors && r.errors.length ? 'err' : 'ok', r.errors);
      await loadTrip(state.trip.id, true);
    } catch (e) { fail(e); renderList(); }
  }

  async function setStatus(id, status, advance) {
    const lm = state.landmarks.find((x) => x.id === id);
    if (!lm) return;
    const next = lm.status === status ? 'pendiente' : status;
    const before = orderedVisible();
    const idx = before.findIndex((x) => x.id === id);
    const followingId = before[idx + 1] ? before[idx + 1].id : null;
    try {
      applyLandmark(await store.patchLandmark(id, { status: next }));
      if (advance && state.detail === id) {
        // the item may have just left the filtered list (e.g. "Pendientes"): pick the next survivor
        const after = orderedVisible();
        let target = after.find((x) => x.id === followingId);
        if (!target && !after.find((x) => x.id === id)) target = after[Math.min(idx, after.length - 1)];
        if (target) { state.detail = target.id; state.detailImg = 0; }
        else if (!after.find((x) => x.id === id)) state.detail = null;
      }
      renderList(); renderDetail();
    } catch (e) { fail(e); renderList(); }
  }

  async function saveEdit(form) {
    const id = Number(form.dataset.id);
    const fields = {};
    new FormData(form).forEach((v, k) => { fields[k] = v; });
    try {
      applyLandmark(await store.patchLandmark(id, fields));
      state.editing = null;
      renderList(); renderDetail();
      runEnrich();
    } catch (e) { fail(e); renderList(); }
  }

  async function deleteLandmark(id) {
    const lm = state.landmarks.find((x) => x.id === id);
    if (!lm || !confirm('¿Eliminar "' + lm.name + '" del viaje definitivamente? No se puede deshacer.')) return;
    const list = orderedVisible();
    const idx = list.findIndex((x) => x.id === id);
    try {
      await store.deleteLandmark(id);
      state.landmarks = state.landmarks.filter((x) => x.id !== id);
      if (state.editing === id) state.editing = null;
      if (state.detail === id) {
        const after = orderedVisible();
        const next = after[Math.min(idx, after.length - 1)];
        state.detail = next ? next.id : null; state.detailImg = 0;
      }
      renderList(); renderDetail();
    } catch (e) { fail(e); renderList(); }
  }

  async function addImage(form) {
    const id = Number(form.dataset.id);
    const file = form.file && form.file.files[0];
    const kind = form.kind.value;
    try {
      let body;
      if (file && !STANDALONE) { body = new FormData(); body.append('file', file); body.append('kind', kind); }
      else body = { url: form.url.value.trim(), kind };
      applyLandmark(await store.addImage(id, body));
      state.addingImage = false; state.detailImg = pictures(state.landmarks.find((x) => x.id === id)).findIndex((p) => p.source === 'manual');
      if (state.detailImg < 0) state.detailImg = 0;
      patchCard(state.landmarks.find((x) => x.id === id)); renderDetail();
    } catch (e) { alert(e.message || 'No se ha podido añadir la imagen'); }
  }

  // ---- itinerario: acciones y arrastre
  // ---- guardado de los campos del itinerario sin interrumpir lo que se está escribiendo
  let fieldTimer = null, fieldPendingRender = false;

  function queueFieldSave(el) {
    clearTimeout(fieldTimer);
    fieldTimer = setTimeout(() => saveField(el), 900);
  }

  async function saveField(el) {
    clearTimeout(fieldTimer);
    const id = Number(el.dataset.id), value = el.value;
    try {
      if (el.dataset.dayField) {
        const name = el.dataset.dayField;
        applyDay(await store.patchDay(id, { [name]: name === 'stop_id' ? (value ? Number(value) : null) : value }));
      } else {
        applyDay(await store.patchItem(id, { [el.dataset.itemField]: value }));
      }
    } catch (e) { fail(e); }
    if (document.activeElement === el) fieldPendingRender = true;   // sigue escribiendo: luego
    else { fieldPendingRender = false; renderList(); }
  }

  async function dayDo(fn) {
    try { await fn(); } catch (e) { fail(e); }
    renderList();
  }

  function wireItems() {
    const rows = Array.from(document.querySelectorAll('.dayc li[draggable]'));
    let dragged = null;
    rows.forEach((el) => {
      el.addEventListener('dragstart', (e) => { dragged = el; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', el.dataset.item); } catch (x) { /* ie */ } });
      el.addEventListener('dragend', () => { el.classList.remove('dragging'); rows.forEach((x) => x.classList.remove('over')); });
      el.addEventListener('dragover', (e) => { e.preventDefault(); if (dragged && dragged !== el) el.classList.add('over'); });
      el.addEventListener('dragleave', () => el.classList.remove('over'));
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!dragged || dragged === el) return;
        moveItem(Number(dragged.dataset.item), Number(dragged.dataset.day), Number(el.dataset.day), Number(el.dataset.item));
      });
    });
    // soltar sobre el hueco del día (lista vacía o zona baja) = al final de ese día
    Array.from(document.querySelectorAll('.dayc ul')).forEach((ul) => {
      ul.addEventListener('dragover', (e) => e.preventDefault());
      ul.addEventListener('drop', (e) => {
        if (!dragged || e.target.closest('li[draggable]')) return;
        e.preventDefault();
        moveItem(Number(dragged.dataset.item), Number(dragged.dataset.day), Number(ul.closest('.dayc').dataset.day), null);
      });
    });
  }

  // Mueve un elemento dentro de su día o a otro, dejándolo delante de `beforeId` (o al final).
  function moveItem(itemId, fromDayId, toDayId, beforeId) {
    const from = state.days.find((d) => d.id === fromDayId), to = state.days.find((d) => d.id === toDayId);
    if (!from || !to) return;
    dayDo(async () => {
      if (fromDayId !== toDayId) {
        applyDay(await store.patchItem(itemId, { day_id: toDayId }));   // devuelve el día destino
        const src = state.days.find((d) => d.id === fromDayId);
        if (src) src.items = (src.items || []).filter((it) => it.id !== itemId);
      }
      const target = state.days.find((d) => d.id === toDayId);
      const ids = (target.items || []).map((it) => it.id).filter((id) => id !== itemId);
      const at = beforeId != null ? ids.indexOf(beforeId) : -1;
      if (at < 0) ids.push(itemId); else ids.splice(at, 0, itemId);
      applyDay(await store.orderItems(toDayId, ids));
    });
  }

  function nextDate() {
    const dated = state.days.filter((d) => d.date).map((d) => d.date).sort();
    if (!dated.length) return new Date().toISOString().slice(0, 10);
    const d = new Date(dated[dated.length - 1] + 'T12:00:00');
    d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
  }

  const actions = {
    'dismiss-msg': () => { state.msg = null; state.screen === 'trip' ? renderList() : render(); },
    'day-add': () => dayDo(async () => {
      const last = state.days[state.days.length - 1];
      applyDay(await store.createDay(state.trip.id, { date: nextDate(), stop_id: last ? last.stop_id : (state.stops[0] || {}).id || null }));
    }),
    'day-delete': (el) => {
      const day = state.days.find((d) => d.id === Number(el.dataset.id));
      const n = state.days.indexOf(day) + 1;
      if (!day || !confirm('¿Borrar el día ' + n + (day.date ? ' (' + prettyDate(day.date) + ')' : '') + ' y sus ' + (day.items || []).length + ' elementos?\nLos hitos no se borran, solo dejan de estar en ese día.')) return;
      dayDo(async () => { await store.deleteDay(day.id); state.days = state.days.filter((d) => d.id !== day.id); });
    },
    'pick-day': (el) => { setActiveDay(Number(el.dataset.id)); renderList(); },
    'day-mode': () => {
      state.dayMode = !state.dayMode;
      try { localStorage.setItem('archtrip:dayMode', state.dayMode ? '1' : '0'); } catch (e) { /* ignore */ }
      renderList();
    },
    'toggle-day': (el) => toggleDay(Number(el.dataset.id)),
    'picker-open': (el) => { state.picker = { dayId: Number(el.dataset.id), query: '' }; renderList(); const i = document.getElementById('picker-input'); if (i) i.focus(); },
    'picker-close': () => { state.picker = null; renderList(); },
    'pick-landmark': (el) => dayDo(async () => {
      applyDay(await store.addItem(Number(el.dataset.day), { kind: 'hito', landmark_id: Number(el.dataset.id) }));
    }),
    'item-note': (el) => dayDo(async () => {
      const day = applyDayAnd(await store.addItem(Number(el.dataset.id), { kind: 'nota', text: 'nota' }));
      setTimeout(() => {                       // deja el cursor dentro de la nota recién creada
        const last = (day.items || []).filter((it) => it.kind === 'nota').pop();
        const box = last && document.querySelector('textarea[data-id="' + last.id + '"]');
        if (box) { box.focus(); box.select(); }
      }, 0);
    }),
    'item-delete': (el) => dayDo(async () => { applyDay(await store.deleteItem(Number(el.dataset.id))); }),
    'pdf-fotos': () => downloadPhotoPdf(),
    'disc-run': () => runDiscover(),
    'disc-import': () => importChosen(),
    'disc-hours': (el) => { const d = discoverState(); d[el.dataset.field] = Math.max(0, Math.min(6, Number(el.value) || 0)); },
    'disc-source': (el) => {
      const d = discoverState(), src = el.dataset.src;
      d.sources = el.checked ? d.sources.concat([src]).filter((x, i, a) => a.indexOf(x) === i) : d.sources.filter((x) => x !== src);
      if (!d.sources.length) { d.sources = [src]; renderList(); }     // al menos una fuente
    },
    'disc-posible': (el) => { discoverState().include_posible = el.checked; },
    'disc-zone': (el) => { discoverState().zone = el.dataset.zone; renderList(); },
    'disc-pick': (el) => {
      const d = discoverState();
      d.chosen[el.dataset.key] = el.checked;
      const box = el.closest('.cand');
      if (box) box.classList.toggle('on', el.checked);
      const btn = document.querySelector('[data-action="disc-import"]');
      const chosen = Object.keys(d.chosen).filter((k) => d.chosen[k]).length;
      if (btn) { btn.disabled = !chosen; btn.textContent = '＋ Importar ' + (chosen || '') + ' como tal vez'; }
    },
    'disc-all': () => {
      const d = discoverState();
      d.candidates.filter((c) => d.zone === 'todas' || c.zone === d.zone).forEach((c) => { d.chosen[candKey(c)] = true; });
      renderList();
    },
    'disc-none': () => { discoverState().chosen = {}; renderList(); },
    'disc-zone-map': (el) => { discoverState().showZone = el.checked; drawZone(window.L); },
    'disc-one': (el) => {        // importar un candidato suelto desde el mapa
      const d = discoverState();
      d.chosen = { [el.dataset.key]: true };
      if (mapState.map) mapState.map.closePopup();
      importChosen();
    },
    'pdf-cancel': () => { if (state.pdf) state.pdf.cancel = true; },
    'pdf-dismiss': () => { state.pdf = null; renderList(); },
    'item-confirm': (el) => dayDo(async () => {
      const id = Number(el.dataset.id);
      const it = state.days.reduce((f, d) => f || (d.items || []).find((x) => x.id === id), null);
      applyDay(await store.patchItem(id, { needs_confirm: it && it.needs_confirm ? 0 : 1 }));
    }),
    'sort-by-time': (el) => dayDo(async () => {
      const day = state.days.find((d) => d.id === Number(el.dataset.id));
      const ids = (day.items || []).slice().sort((a, b) => (a.at_time || '99:99').localeCompare(b.at_time || '99:99')).map((it) => it.id);
      applyDay(await store.orderItems(day.id, ids));
    }),
    'adm-dismiss': () => { state.admin.note = null; render(); },
    'adm-logout': () => adminDo(async () => { await admin.post('/logout'); state.admin.authed = false; return null; }),
    'adm-open-session': (el) => adminDo(async () => {
      const id = Number(el.dataset.id);
      state.admin.open = state.admin.open === id ? null : id;
      return null;
    }),
    'adm-revert-change': (el) => adminDo(async () => {
      const r = await admin.post('/changes/' + el.dataset.id + '/revert');
      return 'Cambio #' + el.dataset.id + ': ' + r.result;
    }),
    'adm-revert-session': (el) => {
      const s = state.admin.sessions.find((x) => x.id === Number(el.dataset.id));
      if (!s || !confirm('¿Deshacer los ' + s.pending + ' cambios vigentes de la sesión ' + s.id + (s.name ? ' ("' + s.name + '")' : '') + '?\nSe deshacen del último al primero y quedan registrados; se pueden volver a deshacer.')) return;
      adminDo(async () => {
        const r = await admin.post('/sessions/' + s.id + '/revert');
        const bad = r.details.filter((d) => !/^(revertido|hito recuperado|viaje recuperado|\d+ hitos|ruta anterior)/.test(d.result));
        return 'Sesión ' + s.id + ': ' + r.reverted + ' cambios deshechos' + (bad.length ? '; sin deshacer: ' + bad.map((d) => (d.landmark || d.action) + ' (' + d.result + ')').join(', ') : '');
      });
    },
    'adm-backup-now': () => adminDo(async () => { const r = await admin.post('/backups'); return 'Copia creada: ' + r.created; }),
    'adm-restore': (el) => {
      const name = el.dataset.name;
      if (!confirm('¿Sustituir TODOS los datos actuales por la copia ' + name + '?\nEl estado actual se guarda antes como pre-restore-….db, por si hay que volver.')) return;
      adminDo(async () => { const r = await admin.post('/backups/' + encodeURIComponent(name) + '/restore'); return 'Restaurada ' + r.restored + ' (estado previo guardado en ' + r.saved_before + ')'; });
    },
    // la foto de una parada ya no se edita desde aquí: viene en la plantilla de la ruta. El
    // endpoint sigue existiendo (PATCH /api/stops/<id>) para cuando haya edición de rutas.
    'toggle-private': async (el) => {
      const t = state.trips.find((x) => x.id === Number(el.dataset.id));
      if (!t) return;
      if (!t.private && !confirm('¿Dejar «' + t.name + '» solo en la red de casa?\nDesde el enlace de fuera dejará de verse.')) return;
      if (t.private && !confirm('¿Publicar «' + t.name + '»?\nPasará a verse también desde el enlace de fuera.')) return;
      try { await store.patchTrip(t.id, { private: !t.private });
            say(t.private ? '«' + t.name + '» ya se ve desde fuera.' : '«' + t.name + '» queda solo en la red de casa.');
      } catch (e) { fail(e); }
      loadTrips();
    },
    'copy-trip': async (el) => {
      const t = state.trips.find((x) => x.id === Number(el.dataset.id));
      if (!t) return;
      const name = prompt('Nombre de la variante:', t.name + ' (variante)');
      if (!name) return;
      try {
        const copia = await store.copyTrip(t.id, { name: name.trim(), private: true });
        say('Copiado «' + t.name + '» con sus ' + copia.landmarks + ' hitos. La variante empieza solo en local: publícala cuando quieras.');
      } catch (e) { fail(e); }
      loadTrips();
    },
    'delete-trip': async (el) => {
      const t = state.trips.find((x) => x.id === Number(el.dataset.id));
      if (!t || !confirm('¿Borrar el viaje "' + t.name + '" con todos sus hitos?')) return;
      try { await store.deleteTrip(t.id); } catch (e) { fail(e); }
      loadTrips();
    },
    'rename-trip': async () => {
      const name = prompt('Nombre del viaje', state.trip.name);
      if (!name || name.trim() === state.trip.name) return;
      try { state.trip = await store.renameTrip(state.trip.id, name.trim()); render(); } catch (e) { fail(e); renderList(); }
    },
    'pick-file': (el) => { app.querySelector('input[data-upload="' + el.dataset.kind + '"]').click(); },
    'filter': (el) => { state.filter = el.dataset.filter; renderList(); },
    'fit-map': () => { mapState.fitted = false; renderMap(); },
    'view': (el) => {
      state.view = el.dataset.view;
      try { localStorage.setItem('archtrip:view', state.view); } catch (e) { /* ignore */ }
      renderList();
    },
    'set-status': (el) => setStatus(Number(el.dataset.id), el.dataset.status, false),
    'edit': (el) => { state.editing = Number(el.dataset.id); if (state.detail != null) renderDetail(); else { if (state.view !== 'lista') state.view = 'lista'; renderList(); } },
    'cancel-edit': () => { state.editing = null; renderList(); renderDetail(); },
    'delete-landmark': (el) => deleteLandmark(Number(el.dataset.id)),
    'retry-geocode': async (el) => {
      try { applyLandmark(await store.patchLandmark(Number(el.dataset.id), { retry_geocode: true })); state.editing = null; renderList(); renderDetail(); runEnrich(); }
      catch (e) { fail(e); renderList(); }
    },
    'refresh-images': async (el) => {
      try { applyLandmark(await store.refreshImages(Number(el.dataset.id))); state.editing = null; state.detailImg = 0; renderList(); renderDetail(); runEnrich(); }
      catch (e) { fail(e); renderList(); }
    },
    'delete-image': async (el) => {
      try { applyLandmark(await store.deleteImage(Number(el.dataset.id), Number(el.dataset.img))); state.detailImg = Math.max(0, state.detailImg - 1); patchCard(state.landmarks.find((x) => x.id === Number(el.dataset.id))); renderDetail(); }
      catch (e) { fail(e); renderList(); }
    },
    'map-photos': (el) => {
      state.mapPhotos = el.checked;
      try { localStorage.setItem('archtrip:mapphotos', el.checked ? '1' : '0'); } catch (e) { /* ignore */ }
      if (mapState.map && window.L) updateMarkers(window.L);
    },
    'web-image': async (el) => {
      const id = Number(el.dataset.id);
      if (state.fishing) return;
      state.fishing = id; renderDetail();
      try {
        const r = await store.webImage(id);
        applyLandmark(r.landmark);
        state.fishing = null; state.detailImg = 0;
        if (!r.found) state.msg = { kind: 'err', text: 'No se ha encontrado ninguna foto que sea de esa obra. Prueba a añadirla a mano con su dirección.' };
        patchCard(r.landmark); renderDetail();
      } catch (e) { state.fishing = null; fail(e); renderDetail(); }
    },
    'org-toggle': (el) => {
      const id = Number(el.dataset.id);
      state.orgOpen[id] = !state.orgOpen[id];
      if (state.view === 'itinerario') renderList();
      if (state.detail != null) renderDetail();
    },
    'org-note-add': async (el) => {
      const id = Number(el.dataset.id);
      const input = document.querySelector('[data-org-note][data-id="' + id + '"]');
      const text = input ? input.value.trim() : '';
      if (!text) { if (input) input.focus(); return; }
      try {
        applyLandmark(await store.addNote(id, text));
        state.orgOpen[id] = true;
        if (state.view === 'itinerario') renderList(); else patchCard(state.landmarks.find((x) => x.id === id));
        if (state.detail != null) renderDetail();
      } catch (e) { fail(e); renderList(); }
    },
    'org-note-del': async (el) => {
      const id = Number(el.dataset.id);
      try {
        applyLandmark(await store.deleteNote(Number(el.dataset.note)));
        if (state.view === 'itinerario') renderList(); else patchCard(state.landmarks.find((x) => x.id === id));
        if (state.detail != null) renderDetail();
      } catch (e) { fail(e); renderList(); }
    },
    'retry-enrich': () => { state.enrich.error = null; runEnrich(); },
    'save-copy': () => local.saveCopy(),
    'new-mode': (el) => { location.hash = '#/nuevo/' + el.dataset.mode; },
    'copy-prompt': async () => {
      const note = document.getElementById('copy-note');
      try { await navigator.clipboard.writeText(state.promptText || ''); note.textContent = 'copiado ✓'; }
      catch (e) { note.textContent = 'no se ha podido copiar: selecciona el texto y cópialo a mano'; }
      setTimeout(() => { if (note) note.textContent = ''; }, 3000);
    },
    'open': (el) => openDetail(Number(el.dataset.id)),
    'set-kind': async (el) => {
      const id = Number(el.dataset.id), imgId = Number(el.dataset.img);
      try {
        applyLandmark(await store.setImageKind(id, imgId, el.dataset.kind));
        const lm = state.landmarks.find((x) => x.id === id);
        state.detailImg = Math.max(0, pictures(lm).findIndex((p) => p.id === imgId));   // keep showing the same picture
        patchCard(lm); renderDetail();
      } catch (e) { fail(e); renderDetail(); }
    },
    'add-image-form': () => { state.addingImage = true; renderDetail(); setTimeout(() => { const f = document.querySelector('[data-form="add-image"] input[name="url"]'); if (f) f.focus(); }, 0); },
    'cancel-add-image': () => { state.addingImage = false; renderDetail(); },
    'close-detail': () => closeDetail(),
    'copy-link': async (el) => {
      const url = location.origin + location.pathname + '#/viaje/' + state.trip.id + '/hito/' + el.dataset.id;
      try { await navigator.clipboard.writeText(url); el.textContent = 'copiado ✓'; } catch (e) { prompt('Enlace a esta ficha', url); }
      setTimeout(() => { el.textContent = 'enlace'; }, 2000);
    },
    'detail-prev': () => detailMove(-1),
    'detail-next': () => detailMove(1),
    'show-img': (el) => { state.detailImg = Number(el.dataset.i); renderDetail(); },
  };

  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || !actions[el.dataset.action]) return;
    e.preventDefault();
    actions[el.dataset.action](el);
  });

  // el estado de la gestión se guarda al elegirlo; la nota, con Enter
  app.addEventListener('change', async (e) => {
    const sel = e.target.closest('[data-org-status]');
    if (!sel) return;
    const id = Number(sel.dataset.id);
    try {
      applyLandmark(await store.patchLandmark(id, { org_status: sel.value }));
      if (state.view === 'itinerario') renderList(); else patchCard(state.landmarks.find((x) => x.id === id));
      if (state.detail != null) renderDetail();
    } catch (err) { fail(err); renderList(); }
  });

  app.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const input = e.target.closest('[data-org-note]');
    if (!input) return;
    e.preventDefault();
    const btn = document.querySelector('[data-action="org-note-add"][data-id="' + input.dataset.id + '"]');
    if (btn) btn.click();
  });

  app.addEventListener('submit', async (e) => {
    const form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    if (form.dataset.form === 'create-trip') {
      const name = form.name.value.trim();
      if (!name) return;
      try { const t = await store.createTrip(name); location.hash = '#/viaje/' + t.id; } catch (err) { fail(err); render(); }
    } else if (form.dataset.form === 'edit') {
      saveEdit(form);
    } else if (form.dataset.form === 'add-image') {
      addImage(form);
    } else if (form.dataset.form === 'admin-login') {
      adminDo(async () => { await admin.post('/login', { password: form.password.value }); state.admin.authed = true; return null; });
    } else if (form.dataset.form === 'session-name') {
      adminDo(async () => { await admin.patch('/sessions/' + form.dataset.id, { name: form.name.value }); return null; });
    } else if (form.dataset.form === 'admin-search') {
      state.admin.query = form.q.value.trim();
      if (!state.admin.query) { state.admin.history = null; render(); return; }
      adminDo(async () => null);
    }
  });

  app.addEventListener('change', (e) => {
    const field = e.target.closest('[data-day-field], [data-item-field]');
    if (field) {
      // Los <input type=date|time> disparan 'change' con cada tecla (2026 pasa por 0002, 0020…):
      // mientras el campo tenga el foco se espera a que el usuario acabe; si el valor viene de
      // fuera (o ya ha salido del campo) se guarda al momento.
      const typing = (field.type === 'date' || field.type === 'time') && document.activeElement === field;
      if (typing) queueFieldSave(field); else saveField(field);
      return;
    }
    const addDay = e.target.closest('select[data-add-day]');
    if (addDay && addDay.value) {
      const dayId = Number(addDay.value), lmId = Number(addDay.dataset.addDay);
      addDay.value = '';
      dayDo(async () => {
        applyDay(await store.addItem(dayId, { kind: 'hito', landmark_id: lmId }));
        renderDetail();
      });
      return;
    }
    const toggle = e.target.closest('input[data-toggle]');
    if (toggle) {
      state[toggle.dataset.toggle] = toggle.checked;
      try { localStorage.setItem('archtrip:' + toggle.dataset.toggle, toggle.checked ? '1' : '0'); } catch (x) { /* ignore */ }
      renderList();     // el mapa mantiene el encuadre: solo se repintan los puntos
      if (state.detail != null) { if (!orderedVisible().some((x) => x.id === state.detail)) { const first = orderedVisible()[0]; state.detail = first ? first.id : null; } renderDetail(); }
      return;
    }
    const input = e.target.closest('input[data-upload]');
    if (!input) return;
    const file = input.files[0];
    input.value = '';
    upload(input.dataset.upload, file);
  });

  // blur no burbujea: hay que escucharlo en fase de captura
  app.addEventListener('blur', (e) => {
    const field = e.target.closest && e.target.closest('[data-day-field], [data-item-field]');
    if (!field) return;
    if (fieldTimer) saveField(field);
    else if (fieldPendingRender) { fieldPendingRender = false; renderList(); }
  }, true);

  app.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.pickerInput && state.picker) {
      state.picker.query = e.target.value;
      const box = document.querySelector('.picker .hits');
      const day = state.days.find((d) => d.id === state.picker.dayId);
      if (box && day) box.innerHTML = new DOMParser().parseFromString(pickerView(day), 'text/html').querySelector('.hits').innerHTML;
      return;
    }
    if (e.target.id === 'search') {
      state.query = e.target.value;
      if (state.view === 'mapa') renderMap(); else document.getElementById('list').innerHTML = listView();
    }
  });

  // Keyboard curation inside the ficha (ignored while typing in a field).
  document.addEventListener('keydown', (e) => {
    if (state.detail == null) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.ctrlKey || e.metaKey || e.altKey) return;
    const lm = state.landmarks.find((x) => x.id === state.detail);
    if (!lm) return;
    const n = pictures(lm).length;
    const k = e.key.toLowerCase();
    if (e.key === 'Escape') closeDetail();
    else if (e.key === 'ArrowRight') detailMove(1);
    else if (e.key === 'ArrowLeft') detailMove(-1);
    else if (e.key === 'ArrowDown' || e.key === ' ') { if (n) { state.detailImg = (state.detailImg + 1) % n; renderDetail(); } }
    else if (e.key === 'ArrowUp') { if (n) { state.detailImg = (state.detailImg - 1 + n) % n; renderDetail(); } }
    else if (k === 'c') setStatus(lm.id, 'curado', true);
    else if (k === 'p') setStatus(lm.id, 'posible', true);
    else if (k === 'x' || k === 'd') setStatus(lm.id, 'descartado', true);
    else if (e.key === 'Delete') deleteLandmark(lm.id);
    else return;
    e.preventDefault();
  });

  // ------------------------------------------------------------ routing
  function route() {
    if (STANDALONE) { loadTrip(null); return; }
    const m = location.hash.match(/^#\/viaje\/(\d+)(?:\/hito\/(\d+))?/);
    const n = location.hash.match(/^#\/nuevo(?:\/(ia|manual))?/);
    if (m) {
      // same trip already open (e.g. the ficha changed the hash): just open the ficha, don't reload
      if (state.screen === 'trip' && state.trip && state.trip.id === Number(m[1])) { if (m[2]) openDetail(Number(m[2])); else if (state.detail != null) closeDetail(); }
      else loadTrip(Number(m[1]), false, m[2] ? Number(m[2]) : null);
    } else if (n) loadNewTrip(n[1]); else if (location.hash === '#/admin') loadAdmin(); else loadTrips();
  }
  window.addEventListener('hashchange', route);
  // the admin page has no visible link: triple-click the brand in the footer
  if (!STANDALONE) document.querySelector('#credits .brand').addEventListener('click', (e) => { if (e.detail === 3 && !state.publicView) location.hash = '#/admin'; });
  route();
})();
</script>
</body>
</html>
