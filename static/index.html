        if (!html) { alert('No se ha podido generar la copia.'); return; }
        const slug = (data.trip.name || 'viaje').normalize('NFKD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'viaje';
        download('viaje-' + slug + '.html', html);
      },
    };
  })();

  const store = STANDALONE ? local : api;
  if (STANDALONE) window.archtrip = { buildCopy: local.buildCopy };

  // --------------------------------------------------------- rendering
  function render() {
    app.innerHTML = (state.screen === 'trips' ? tripsView() : state.screen === 'new' ? newTripView()
      : state.screen === 'admin' ? adminView() : tripView()) + '<div id="overlay"></div>';
    if (state.screen === 'trip') { renderList(); renderDetail(); }
  }

  function msgView() {
    if (!state.msg) return '';
    const m = state.msg;
    return '<div class="msg ' + (m.type === 'err' ? 'err' : '') + '">' + esc(m.text)
      + (m.list && m.list.length ? '<ul>' + m.list.map((l) => '<li>' + esc(l) + '</li>').join('') + '</ul>' : '')
      + ' <button class="link" data-action="dismiss-msg">cerrar</button></div>';
  }

  function tripsView() {
    return '<h1>archTrip</h1><div class="muted small">Planificación de viajes de arquitectura</div>'
      + msgView()
      + '<div style="margin:18px 0"><a class="btn" href="#/nuevo">＋ Nuevo viaje</a></div>'
      + '<h2>Viajes</h2>'
      + (state.trips.length ? '<div class="trips"><ul>' + state.trips.map((t) =>
          '<li><span class="name"><a href="#/viaje/' + t.id + '">' + esc(t.name) + '</a>'
          + (t.private ? ' <span class="tag local" title="Este viaje solo se ve desde la red de casa: no sale por el enlace de fuera">solo en local</span>' : '')
          + '</span>'
          + '<span class="muted small">' + t.stop_count + ' paradas · ' + t.landmark_count + ' hitos · ' + t.curated_count + ' curados</span>'
          + '<a class="btn quiet" href="#/viaje/' + t.id + '">Abrir</a>'
          + (state.publicView ? '' : '<button class="quiet" data-action="copy-trip" data-id="' + t.id + '" title="Crea una variante con los mismos hitos e itinerario, sin tocar este">Duplicar</button>')
          + (state.publicView ? '' : '<button class="quiet" data-action="toggle-private" data-id="' + t.id + '" title="'
             + attr(t.private ? 'Publicarlo: pasará a verse también desde el enlace de fuera' : 'Esconderlo: solo se verá desde la red de casa') + '">'
             + (t.private ? 'Publicar' : 'Solo local') + '</button>')
          + '<button class="quiet" data-action="delete-trip" data-id="' + t.id + '">Borrar</button></li>'
        ).join('') + '</ul></div>'
        : '<div class="empty">Todavía no hay viajes. Crea el primero arriba.</div>');
  }

  function newTripView() {
    const mode = state.newMode;
    const nameForm = (label) => '<form class="row" data-form="create-trip" style="margin:12px 0"><input type="text" name="name" class="grow" placeholder="Nombre del viaje, p. ej. Portugal 2027" required>'
      + '<button type="submit">' + label + '</button></form>';
    let body = '';
    if (mode === 'ia') {
      body = '<div class="steps">'
        + '<h3>1 · Descarga las dos plantillas</h3>'
        + '<div class="row"><a class="btn" href="/api/templates/ruta.xlsx">⬇ Plantilla ruta</a><a class="btn" href="/api/templates/hitos.xlsx">⬇ Plantilla hitos</a></div>'
        + '<h3>2 · Pídeselo a tu IA</h3>'
        + '<p><b>Copia el texto de abajo y pégaselo a tu IA (ChatGPT, Claude, Gemini…) junto con LOS DOS archivos de plantilla. '
        + 'Añade tu ruta aproximada y los días de viaje donde lo indica. Te devolverá las dos plantillas rellenas y precuradas.</b></p>'
        + '<div class="row"><button data-action="copy-prompt">Copiar texto</button><a class="btn quiet" href="/api/templates/prompt.md?download=1">⬇ Descargar .md</a><span id="copy-note" class="muted small"></span></div>'
        + '<div class="promptbox" id="promptbox">' + (state.promptText == null ? '<span class="muted">cargando…</span>' : esc(state.promptText)) + '</div>'
        + '<h3>3 · Crea el viaje y sube los archivos</h3>'
        + '<p class="small muted">Crea el viaje ahora o cuando tengas los archivos; en la pantalla del viaje están los botones "Subir ruta" y "Subir hitos".</p>'
        + nameForm('Crear viaje')
        + '</div>';
    } else if (mode === 'manual') {
      body = '<div class="steps"><p class="small muted">Se crea un viaje vacío. Desde su pantalla podrás descargar las plantillas, rellenarlas a mano y subirlas.</p>'
        + nameForm('Crear viaje vacío') + '</div>';
    }
    return '<div class="row"><a href="#/" class="muted">← Viajes</a><h1 class="grow" style="margin:0">Nuevo viaje</h1></div>'
      + msgView()
      + '<div class="choices">'
      + '<button class="choice ' + (mode === 'ia' ? 'on' : '') + '" data-action="new-mode" data-mode="ia"><b>Crear viaje asistido por IA</b><span class="small muted">Descargas las plantillas, se las das a tu IA con un encargo ya escrito y te devuelve la lista de hitos precurada.</span></button>'
      + '<button class="choice ' + (mode === 'manual' ? 'on' : '') + '" data-action="new-mode" data-mode="manual"><b>Creación manual</b><span class="small muted">Viaje vacío: rellenas tú las plantillas y las subes cuando quieras.</span></button>'
      + '</div>' + body;
  }

  function tripView() {
    const t = state.trip;
    const head = '<div class="row">'
      + (STANDALONE ? '' : '<a href="#/" class="muted">← Viajes</a>')
      + '<h1 class="grow" style="margin:0">' + esc(t.name) + '</h1>'
      + (STANDALONE ? '' : '<button class="link small" data-action="rename-trip">renombrar</button>')
      + '</div>';

    let toolbar;
    if (STANDALONE) {
      toolbar = '<div class="banner small">Copia autónoma del viaje. Los cambios se guardan en este navegador; '
        + 'usa <b>Guardar copia</b> para llevártelos a otro sitio o compartirlos.</div>'
        + '<div class="toolbar"><div class="group"><button data-action="save-copy">Guardar copia</button></div></div>';
    } else {
      toolbar = '<div class="toolbar">'
        + '<div class="group"><a class="btn quiet" href="/api/templates/ruta.xlsx">⬇ Plantilla ruta</a>'
        + '<a class="btn quiet" href="/api/templates/hitos.xlsx">⬇ Plantilla hitos</a>'
        + '<a class="btn quiet" href="/api/templates/prompt.md?download=1" title="Instrucciones para que una IA (ChatGPT, Claude, Gemini…) rellene las dos plantillas y las precure">⬇ Prompt para IA</a></div>'
        + '<div class="group"><button data-action="pick-file" data-kind="route">⬆ Subir ruta</button>'
        + '<button data-action="pick-file" data-kind="landmarks">⬆ Subir hitos</button>'
        + '<button data-action="pick-file" data-kind="paseos" title="Un .geojson con recorridos (el que sale de QGIS): cada uno entra como un hito más, con su recorrido y con su entrada como punto">⬆ Subir paseos</button>'
        + '<input type="file" accept=".xlsx" data-upload="route" hidden><input type="file" accept=".xlsx" data-upload="landmarks" hidden>'
        + '<input type="file" accept=".geojson,.json" data-upload="paseos" hidden></div>'
        + '<div class="group"><a class="btn quiet" href="/api/trips/' + t.id + '/export/itinerario" download>⬇ Itinerario (PDF)</a>'
        + '<a class="btn quiet" href="/api/trips/' + t.id + '/export/html" download>Exportar HTML</a>'
        + '<a class="btn quiet" href="/api/trips/' + t.id + '/export/obsidian" download>Exportar Obsidian</a></div>'
        + '</div>';
    }

    return head + toolbar + '<div id="msg">' + msgView() + '</div><div id="progress"></div>'
      + '<h2>Ruta</h2><div id="route"></div>'
      + '<h2>Hitos</h2>'
      + '<div class="controls"><div id="tabs" class="tabs"></div>'
      + '<input type="text" id="search" class="grow" placeholder="buscar edificio, arquitecto o ciudad" value="' + attr(state.query) + '">'
      + '<div class="views" id="views"></div></div>'
      + '<div id="daybar"></div><div id="list"></div>';
  }

  function routeView() {
    if (!state.stops.length) {
      return '<div class="muted">' + (STANDALONE ? 'Sin ruta.' : 'Sube la ruta (Excel) para calcular tiempos en coche desde cada parada.') + '</div>';
    }
    return '<div class="route">' + state.stops.map((s) => {
      const glyph = s.geocode_status === 'ok' ? '<span class="ok">✓</span>'
        : s.geocode_status === 'fallido' ? '<span class="warn" title="No se ha podido localizar">✗</span>' : '<span class="muted">⏳</span>';
      const pic = s.photo_thumb
        ? '<img src="' + attr(s.photo_thumb) + '" alt="" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=nopic>sin foto</div>\'">'
        : '<div class="nopic">' + (s.images_status === 'pendiente' && !STANDALONE ? '⏳ buscando foto…' : 'sin foto') + '</div>';
      // la foto de la parada viene en la plantilla de la ruta (columna «Foto (URL)») y se queda
      // así: mientras no haya edición de rutas en la interfaz, los botones solo hacían ruido
      return '<div class="stop card2"><span class="pic">' + pic + '</span>'
        + '<div class="cap">' + s.position + '. <b>' + esc(s.city) + '</b> ' + glyph + '</div></div>';
    }).join('<span class="arrow">→</span>') + '</div>';
  }

  function progressView() {
    const e = state.enrich;
    if (STANDALONE) return '';
    if (e.error) {
      return '<div class="msg err">' + esc(e.error) + ' Quedan ' + e.remaining + ' elementos por procesar. '
        + '<button class="link" data-action="retry-enrich">Reintentar</button></div>';
    }
    if (e.running) {
      const total = e.total || e.remaining || 1;
      const pct = Math.max(2, Math.round(100 * (total - e.remaining) / total));
      const c = state.pending || {};
      const what = (c.stops || c.geocode || c.drive) ? 'Localizando en el mapa' : c.images ? 'Buscando fotos y planos'
        : c.links ? 'Comprobando enlaces en ArchDaily y Arquitectura Viva' : 'Buscando una foto de cada ciudad de la ruta';
      return '<div class="progress">' + what + '… quedan ' + e.remaining
        + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }
    return '';
  }

  function counts() {
    const c = { todos: state.landmarks.length, pendiente: 0, curado: 0, posible: 0, descartado: 0, impreciso: 0 };
    state.landmarks.forEach((lm) => {
      c[lm.status] = (c[lm.status] || 0) + 1;
      if (!located(lm) && !(state.hideRejected && lm.status === 'descartado')) c.impreciso += 1;
    });
    return c;
  }

  function tabsView() {
    const c = counts();
    if (state.hideRejected) c.todos -= c.descartado;
    return FILTERS.map((f) => '<button class="' + (state.filter === f ? 'on' : '') + '" data-action="filter" data-filter="' + f + '"'
      + (f === 'impreciso' ? ' title="Hitos situados solo por el centro de su ciudad, no encontrados, o todavía sin buscar: el punto del mapa y el tiempo en coche no son de fiar"' : '')
      + '>' + FILTER_LABEL[f] + ' ' + c[f] + '</button>').join('')
      + '<label class="check" title="Los descartados solo se ven en su pestaña"><input type="checkbox" data-toggle="hideRejected" ' + (state.hideRejected ? 'checked' : '') + '> ocultar descartados</label>';
  }

  function viewsView() {
    return Object.keys(VIEWS).filter((v) => !(STANDALONE && SOLO_SERVIDOR[v])).map((v) => '<button class="' + (state.view === v ? 'on' : '') + '" data-action="view" data-view="' + v + '">' + VIEWS[v] + '</button>').join('');
  }

  function visibleLandmarks() {
    const needle = state.query.trim().toLowerCase();
    return state.landmarks.filter((lm) => (state.filter === 'todos' || state.filter === 'impreciso' || lm.status === state.filter)
      && (state.filter !== 'impreciso' || !located(lm))
      && !(state.hideRejected && state.filter !== 'descartado' && lm.status === 'descartado')
      && (!needle || (lm.name + ' ' + lm.architect + ' ' + lm.city).toLowerCase().indexOf(needle) >= 0));
  }

  // Landmarks grouped by nearest route stop, ordered by drive time (vague ones last).
  function groups(items) {
    const map = new Map();
    items.forEach((lm) => {
      const key = lm.nearest_stop_position != null ? lm.nearest_stop_position : 9999;
      if (!map.has(key)) map.set(key, { key, city: lm.nearest_stop_city, items: [] });
      map.get(key).items.push(lm);
    });
    const vague = (x) => x.geocode_status === 'ciudad' ? 1 : 0;
    return Array.from(map.values()).sort((a, b) => a.key - b.key).map((g) => {
      g.items.sort((a, b) => vague(a) - vague(b) || (a.drive_minutes == null) - (b.drive_minutes == null)
        || (a.drive_minutes || 0) - (b.drive_minutes || 0) || a.sort_order - b.sort_order || a.id - b.id);
      return g;
    });
  }
  function groupTitle(g) {
    return g.key === 9999
      ? (state.stops.length ? 'Sin localizar' : 'Todos los hitos')
      : 'Desde ' + esc(g.city) + ' <span class="muted">(parada ' + g.key + ')</span>';
  }
  // The ordered list the ficha walks through with ← →
  function orderedVisible() {
    const items = state.view === 'arquitectos'
      ? architectGroups(visibleLandmarks()).reduce((acc, g) => acc.concat(g.items), [])
      : groups(visibleLandmarks()).reduce((acc, g) => acc.concat(g.items), []);
    return state.skipRejected && state.filter !== 'descartado' ? items.filter((lm) => lm.status !== 'descartado') : items;
  }
  // Grouped by architect (studio), most works first, for the "Arquitectos" view.
  function architectGroups(items) {
    const map = new Map();
    items.forEach((lm) => {
      const key = lm.architect.trim().toLowerCase().replace(/\s+/g, ' ');
      if (!map.has(key)) map.set(key, { key, name: lm.architect.trim(), items: [] });
      map.get(key).items.push(lm);
    });
    return Array.from(map.values()).sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name))
      .map((g) => { g.items.sort((a, b) => (a.nearest_stop_position || 9999) - (b.nearest_stop_position || 9999) || (a.year || '').localeCompare(b.year || '')); return g; });
  }

  // un paseo dice su longitud donde un edificio diría su año
  function walkTag(lm) {
    return isWalk(lm) ? 'paseo' + (walkLength(lm) ? ' · ' + walkLength(lm) : '') : '';
  }

  function driveText(lm) {
    if (lm.drive_minutes != null && lm.nearest_stop_city) {
      if (lm.geocode_status === 'ciudad') {
        // only the city centre was found: the time is city-to-city, not to the building
        const hint = '<span class="warn" title="No se ha encontrado el edificio en el mapa; usa editar para poner dirección o coordenadas">sin localizar con precisión</span>';
        if (lm.drive_minutes < 2) return hint + ' <span class="muted">· está en ' + esc(lm.city) + '</span>';
        return hint + ' · ⏱ <span class="approx" title="Tiempo hasta el centro de ' + attr(lm.city) + ', no hasta el edificio">≈</span> '
          + minutesText(lm.drive_minutes) + ' en coche desde ' + esc(lm.nearest_stop_city) + ' hasta ' + esc(lm.city);
      }
      const approx = lm.drive_source === 'estimado';
      const why = 'Estimación por distancia en línea recta (sin conexión con el servicio de rutas)';
      return '⏱ ' + (approx ? '<span class="approx" title="' + attr(why) + '">≈</span> ' : '')
        + minutesText(lm.drive_minutes) + ' en coche desde ' + esc(lm.nearest_stop_city)
        + (lm.drive_km != null ? ' (' + Math.round(lm.drive_km) + ' km)' : '');
    }
    if (lm.geocode_status === 'fallido') return '<span class="warn">⚠ no se ha podido localizar</span> <span class="small">— usa <i>editar</i> para poner dirección o coordenadas</span>';
    if (lm.lat == null) return STANDALONE ? '' : '<span class="muted">⏳ localizando…</span>';
    if (!state.stops.length) return '<span class="muted">sin ruta para calcular el tiempo</span>';
    return STANDALONE ? '' : '<span class="muted">⏳ calculando tiempo…</span>';
  }

  function statusButtons(lm, extra) {
    const btn = (s, label) => '<button class="' + (lm.status === s ? 'on ' + s : 'quiet') + '" data-action="set-status" data-id="' + lm.id + '" data-status="' + s + '">' + label + '</button>';
    return btn('curado', '✓ Curar') + btn('posible', '? Posible') + btn('descartado', '✗ Descartar') + dayButton(lm) + (extra || '');
  }

  // Un clic mete (o saca) el hito del día elegido arriba: vale en fotos, mapa, lista y ficha.
  function dayButton(lm) {
    const day = state.dayMode ? activeDay() : null;   // plegada = fuera de en medio
    if (!day) return '';
    const n = state.days.indexOf(day) + 1;
    const inside = (day.items || []).some((it) => it.kind === 'hito' && it.landmark_id === lm.id);
    return '<button class="dayadd' + (inside ? ' on' : '') + '" data-action="toggle-day" data-id="' + lm.id + '"'
      + ' title="' + attr(inside ? 'Quitar del ' + dayLabel(day, n) : 'Añadir al ' + dayLabel(day, n)) + '">'
      + (inside ? 'D' + n + ' ✓' : '＋ D' + n) + '</button>';
  }

  // hito -> número del día en el que está (el primero, si está en varios); en el mapa se
  // pinta relleno con ese número dentro
  function assignedDays() {
    const map = new Map();
    state.days.forEach((d, i) => (d.items || []).forEach((it) => {
      if (it.kind === 'hito' && !map.has(it.landmark_id)) map.set(it.landmark_id, i + 1);
    }));
    return map;
  }
  function activeDay() {
    if (STANDALONE || !state.days.length) return null;
    return state.days.find((d) => d.id === state.activeDay) || null;
  }

  function setActiveDay(id) {
    state.activeDay = id;
    try { localStorage.setItem('archtrip:day:' + state.trip.id, id == null ? '' : String(id)); } catch (e) { /* ignore */ }
  }

  function shortDate(value) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
    return m ? Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1].slice(0, 3) : '';
  }

  function daybarView() {
    if (STANDALONE || state.view === 'itinerario' || state.view === 'descubrir' || !state.days.length) return '';
    const chips = state.days.map((d, i) => {
      const hits = (d.items || []).filter((it) => it.kind === 'hito').length;
      const label = 'D' + (i + 1) + (d.date ? ' · ' + shortDate(d.date) : d.title ? ' · ' + d.title.slice(0, 12) : '');
      return '<button class="' + (state.activeDay === d.id ? 'on' : 'quiet') + '" data-action="pick-day" data-id="' + d.id + '"'
        + ' title="' + attr(dayLabel(d, i + 1)) + '">' + esc(label) + (hits ? ' (' + hits + ')' : '') + '</button>';
    }).join('');
    const placed = assignedDays().size;
    if (!state.dayMode) {     // plegada: solo el asa, para que no moleste mientras se cura
      return '<div class="daybar off"><span class="lab">Itinerario</span>'
        + '<span class="muted small">' + placed + ' de ' + state.landmarks.length + ' hitos repartidos en ' + state.days.length + ' días</span>'
        + '<button class="fold" data-action="day-mode" title="Mostrar la barra para asignar hitos a días">▸ asignar a días</button></div>';
    }
    return '<div class="daybar"><span class="lab">Añadir al día</span>' + chips
      + '<span class="muted small">y pulsa ＋ D' + (state.days.indexOf(activeDay()) + 1) + ' en cada hito</span>'
      + '<span class="grow"></span><a class="btn quiet small" href="#" data-action="view" data-view="itinerario" style="font-size:12px;padding:3px 8px">ver itinerario</a>'
      + '<button class="fold" data-action="day-mode" title="Ocultar esta barra y los botones ＋ de las fichas">▾ ocultar</button></div>';
  }

  async function toggleDay(lmId) {
    const day = activeDay();
    if (!day) return;
    const item = (day.items || []).find((it) => it.kind === 'hito' && it.landmark_id === lmId);
    try {
      applyDay(item ? await store.deleteItem(item.id) : await store.addItem(day.id, { kind: 'hito', landmark_id: lmId }));
    } catch (e) { fail(e); renderList(); return; }
    const bar = document.getElementById('daybar');
    if (bar) bar.innerHTML = daybarView();
    const lm = state.landmarks.find((x) => x.id === lmId);
    if (state.view === 'mapa') {
      const marker = mapState.markers && mapState.markers[lmId];
      if (marker && window.L) marker.setIcon(landmarkIcon(window.L, lm, marker.options.offRoute));
      if (marker && marker.isPopupOpen()) marker.setPopupContent(popupView(lm));
      if (mapState.listPopup) openClusterList(mapState.listPopup.latlng, mapState.listPopup.ids);
    } else if (lm) patchCard(lm);
    if (state.detail === lmId) renderDetail();
  }

  function linksView(lm) {
    // ArchDaily / AV: a direct link when one is known; the site search only while the
    // lookup is still pending; nothing once the lookup found no page.
    const checked = lm.links_status === 'ok';
    const ad = safeUrl(lm.url_archdaily) ? '<a href="' + attr(lm.url_archdaily) + '" target="_blank" rel="noopener">ArchDaily</a>'
      : (checked ? '' : '<a href="' + attr(archdailyUrl(lm)) + '" target="_blank" rel="noopener" class="muted">buscar en ArchDaily</a>');
    const av = safeUrl(lm.url_av) ? '<a href="' + attr(lm.url_av) + '" target="_blank" rel="noopener">Arquitectura Viva</a>'
      : (checked ? '' : '<a href="' + attr(avUrl(lm)) + '" target="_blank" rel="noopener" class="muted">buscar en Arquitectura Viva</a>');
    const dir = directionsUrl(lm);
    return ad + av
      + (safeUrl(lm.wikipedia_url) ? '<a href="' + attr(lm.wikipedia_url) + '" target="_blank" rel="noopener">Wikipedia</a>' : '')
      + '<a href="' + attr(mapsUrl(lm)) + '" target="_blank" rel="noopener">Google Maps</a>'
      + (dir ? '<a href="' + attr(dir) + '" target="_blank" rel="noopener" title="Ruta en coche desde la parada">cómo llegar</a>' : '');
  }

  function picCount(lm) {
    const p = photosOf(lm).length, d = plansOf(lm).length;
    if (!p && !d) return '';
    return (p ? p + (p === 1 ? ' foto' : ' fotos') : '') + (p && d ? ' · ' : '') + (d ? d + (d === 1 ? ' plano' : ' planos') : '');
  }

  // ---- lista
  function landmarkView(lm) {
    const meta = [esc(lm.city), lm.year ? esc(lm.year) : null, driveText(lm)].filter(Boolean).join(' · ');
    const main = mainPhoto(lm);
    const thumb = main ? '<a class="thumb" href="#" data-action="open" data-id="' + lm.id + '">'
      + '<img src="' + attr(main.thumb) + '" alt="" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></a>' : '';
    const pc = picCount(lm);
    return '<div class="lm ' + lm.status + '" id="lm-' + lm.id + '"><div class="body">'
      + '<div class="arch">' + esc(lm.architect) + '</div><div class="name">' + esc(lm.name) + '</div>'
      + '<div class="meta">' + meta + '</div>'
      + '<div class="links small">' + linksView(lm)
      + '<button class="link" data-action="open" data-id="' + lm.id + '">' + (pc ? 'ficha (' + pc + ')' : 'ficha') + '</button>'
      + '<button class="link" data-action="edit" data-id="' + lm.id + '">editar</button></div>'
      + (lm.notes ? '<div class="notes small">' + esc(lm.notes) + '</div>' : '')
      + '<div class="actions">' + statusButtons(lm, '<button class="link danger" data-action="delete-landmark" data-id="' + lm.id + '" title="Quitar el hito del viaje definitivamente">eliminar del todo</button>') + '</div>'
      + (state.editing === lm.id ? editView(lm) : '')
      + '</div>' + thumb + '</div>';
  }

  function editView(lm) {
    const f = (name, label, value, wide) => '<div class="' + (wide ? 'wide' : '') + '"><label>' + label + '</label>'
      + '<input type="text" name="' + name + '" value="' + attr(value == null ? '' : value) + '"></div>';
    return '<form class="edit" data-form="edit" data-id="' + lm.id + '"><div class="grid2">'
      + f('name', 'Edificio', lm.name) + f('architect', 'Arquitecto', lm.architect) + f('city', 'Ciudad', lm.city)
      + f('address', 'Dirección', lm.address) + f('year', 'Año', lm.year)
      + f('lat', 'Latitud', lm.lat) + f('lon', 'Longitud', lm.lon)
      + f('url_archdaily', 'URL ArchDaily', lm.url_archdaily, true) + f('url_av', 'URL Arquitectura Viva', lm.url_av, true)
      + f('url_image1', 'URL imagen 1', lm.url_image1, true) + f('url_image2', 'URL imagen 2', lm.url_image2, true)
      + '<div class="wide"><label>Notas</label><textarea name="notes" rows="3">' + esc(lm.notes) + '</textarea></div>'
      + '</div><div class="row" style="margin-top:10px"><button type="submit">Guardar</button>'
      + '<button type="button" class="quiet" data-action="cancel-edit">Cancelar</button>'
      + (STANDALONE ? '' : '<button type="button" class="quiet" data-action="retry-geocode" data-id="' + lm.id + '" title="Borra las coordenadas y vuelve a buscarlas con la dirección y ciudad actuales">Volver a localizar</button>')
      + (STANDALONE ? '' : '<button type="button" class="quiet" data-action="refresh-images" data-id="' + lm.id + '" title="Descarta las fotos encontradas y vuelve a buscarlas">Buscar fotos otra vez</button>')
      + '<span class="grow"></span><button type="button" class="danger" data-action="delete-landmark" data-id="' + lm.id + '">Borrar hito</button>'
      + '</div>' + (STANDALONE ? '' : '<div class="muted small" style="margin-top:6px">Si cambias latitud/longitud se recalcula el tiempo en coche.</div>') + '</form>';
  }

  // ---- fotos
  function cardView(lm) {
    const main = mainPhoto(lm);
    const pic = main ? '<img src="' + attr(main.thumb) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'beforeend\',\'<div class=nopic>imagen no disponible</div>\')">'
      : '<div class="nopic">' + (lm.images_status === 'pendiente' && !STANDALONE ? '⏳ buscando fotos…' : 'sin foto') + '</div>';
    const pc = picCount(lm);
    return '<div class="card ' + lm.status + '" id="card-' + lm.id + '">'
      + '<a class="pic" href="#" data-action="open" data-id="' + lm.id + '">' + pic + (pc ? '<span class="badge">' + pc + '</span>' : '') + '</a>'
      + '<div class="cbody"><div class="arch">' + esc(lm.architect) + '</div><div class="name">' + esc(lm.name) + '</div>'
      + '<div class="meta">' + [esc(lm.city), walkTag(lm), driveText(lm)].filter(Boolean).join(' · ') + '</div>'
      + '<div class="actions">' + statusButtons(lm, trashButton(lm)) + '</div></div></div>';
  }
  function trashButton(lm) {
    return lm.status === 'descartado'
      ? '<button class="trash" data-action="delete-landmark" data-id="' + lm.id + '" title="Eliminar del viaje definitivamente">🗑</button>' : '';
  }

  function emptyView(items) {
    if (!state.landmarks.length) {
      return '<div class="empty">' + (STANDALONE ? 'Este viaje no tiene hitos.' : 'Descarga la plantilla de hitos, rellénala y súbela aquí.') + '</div>';
    }
    if (!items.length) {
      return '<div class="empty">' + (state.filter === 'impreciso'
        ? 'Todos los hitos están localizados con precisión.' : 'Nada que mostrar con este filtro.') + '</div>';
    }
    return null;
  }

  // ---- itinerario: días con fecha, hitos ordenados con hora y notas sueltas
  const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  function prettyDate(value) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
    if (!m) return '';
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    if (isNaN(d)) return '';
    return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
  }

  function sortDays() {
    state.days.sort((a, b) => {
      const da = a.date || '', db2 = b.date || '';
      if (!!da !== !!db2) return da ? -1 : 1;          // los días sin fecha, al final
      if (da !== db2) return da < db2 ? -1 : 1;
      return (a.position - b.position) || (a.id - b.id);
    });
  }

  function applyStop(stop) {
    const i = state.stops.findIndex((s) => s.id === stop.id);
    if (i >= 0) state.stops[i] = stop;
  }

  function applyDayAnd(day) { applyDay(day); return day; }

  function applyDay(day) {
    const i = state.days.findIndex((d) => d.id === day.id);
    if (i < 0) state.days.push(day); else state.days[i] = day;
    sortDays();
  }

  // día(s) en los que ya está metido un hito, para avisar al añadirlo otra vez
  function daysOfLandmark(lmId) {
    return state.days.filter((d) => (d.items || []).some((it) => it.kind === 'hito' && it.landmark_id === lmId));
  }
  function dayLabel(day, n) { return 'Día ' + n + (day.date ? ' · ' + prettyDate(day.date) : '') + (day.title ? ' · ' + day.title : ''); }

  // cómo se lee cada estado dentro de un itinerario ya montado
  const ITEM_TAG = { curado: 'fijo', posible: 'opcional', pendiente: 'sin curar', descartado: 'descartado' };

  // La gestión de la visita de un hito: estado, una línea para ir contando cómo va, y el
  // historial de lo que se fue contando. Se usa igual en el itinerario y en la ficha.
  function orgBox(lm) {
    const notes = lm.org_notes || [];
    const opciones = ['<option value="">(sin estado)</option>'].concat(Object.keys(ORG).map((k) =>
      '<option value="' + k + '"' + (lm.org_status === k ? ' selected' : '') + '>' + ORG[k].label + '</option>')).join('');
    const historial = notes.length
      ? '<div class="muted small" style="margin-top:6px">Historial</div><ul>' + notes.map((nt, i) => '<li class="' + (i ? 'old' : '') + '"><span class="when">' + esc(shortStamp(nt.at)) + '</span>'
        + '<span class="grow">' + esc(nt.text) + '</span>'
        + (STANDALONE ? '' : '<button class="link small" data-action="org-note-del" data-note="' + nt.id + '" data-id="' + lm.id + '" title="Borrar esta actualización">✕</button>')
        + '</li>').join('') + '</ul>'
      : '<div class="muted small" style="margin-top:6px">Todavía no hay actualizaciones.</div>';
    if (STANDALONE) {
      return '<div class="orgbox">' + (lm.org_status ? '<b>' + esc(ORG[lm.org_status].label) + '</b>' : '<span class="muted">sin estado</span>') + historial + '</div>';
    }
    return '<div class="orgbox">'
      + '<div class="row"><select data-org-status data-id="' + lm.id + '" title="Cómo va la gestión de esta visita">' + opciones + '</select>'
      + '<input type="text" class="grow" data-org-note data-id="' + lm.id + '" placeholder="añadir una actualización (se guarda con la fecha)">'
      + '<button data-action="org-note-add" data-id="' + lm.id + '">Añadir</button></div>'
      + historial + '</div>';
  }

  function orgButton(lm) {
    const notes = (lm.org_notes || []).length;
    const open = !!state.orgOpen[lm.id];
    // la última actualización ya se ve en la fila, así que esto es para el historial y para
    // cambiar el estado o escribir una nueva
    return '<button class="link small" data-action="org-toggle" data-id="' + lm.id + '"'
      + ' title="' + attr(notes > 1 ? 'Ver las ' + notes + ' actualizaciones, cambiar el estado o escribir otra'
        : 'Cambiar el estado de la gestión o escribir una actualización') + '">'
      + (open ? '▾' : '▸') + (notes > 1 ? ' historial (' + notes + ')' : ' gestión') + '</button>';
  }

  // La última línea de cómo va la gestión: es lo que hay que ver de un vistazo.
  function orgLast(lm) {
    const last = (lm.org_notes || [])[0];
    if (!last) return '';
    return '<div class="orglast"><span class="when">' + esc(shortStamp(last.at)) + '</span>'
      + esc(last.text) + '</div>';
  }

  function shortStamp(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return String(iso).slice(0, 10);
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' ' + d.toTimeString().slice(0, 5);
  }

  function itemView(it, day, n) {
    const ro = STANDALONE;
    const time = ro ? '<span class="muted small" style="min-width:44px">' + esc(it.at_time || '') + '</span>'
      : '<input type="time" value="' + attr(it.at_time || '') + '" data-item-field="at_time" data-id="' + it.id + '" title="Hora (opcional)">';
    let body, dot = '', org = null;
    if (it.kind === 'nota') {
      body = ro ? '<div class="note" style="font-style:italic">' + esc(it.text) + '</div>'
        : '<textarea class="note" rows="1" data-item-field="text" data-id="' + it.id + '" placeholder="nota">' + esc(it.text) + '</textarea>';
    } else {
      const lm = state.landmarks.find((x) => x.id === it.landmark_id);
      if (!lm) body = '<span class="muted">hito eliminado</span>';
      else {
        const bits = [esc(lm.city), walkTag(lm) || (lm.year ? esc(lm.year) : null), driveText(lm)].filter(Boolean).join(' · ');
        dot = '<i class="dot" style="background:' + COLORS[lm.status] + '" title="' + attr(ITEM_TAG[lm.status] || lm.status) + '"></i>';
        body = '<div class="arch">' + esc(lm.architect) + '</div>'
          + '<div>' + (STANDALONE ? esc(lm.name) : '<a href="#/viaje/' + state.trip.id + '/hito/' + lm.id + '">' + esc(lm.name) + '</a>') + '</div>'
          + '<div class="meta">' + bits
          + ' · <span class="tag" style="color:' + COLORS[lm.status] + '">' + (ITEM_TAG[lm.status] || '') + '</span>'
          + (it.needs_confirm ? ' · <span class="tag" style="color:var(--warn)">pendiente de confirmar</span>' : '')
          + (lm.org_status ? ' · <span class="orgtag" style="--org:' + ORG[lm.org_status].color + '">' + esc(ORG[lm.org_status].label) + '</span>' : '')
          + ' · ' + orgButton(lm)
          + '</div>'
          + orgLast(lm)
          + (state.orgOpen[lm.id] ? orgBox(lm) : '');
        if (lm.org_status) org = lm.org_status;
      }
    }
    const flag = ro
      ? (it.needs_confirm ? '<span class="flag on" title="Falta permiso o confirmación">⏳</span>' : '')
      : '<button class="flag' + (it.needs_confirm ? ' on' : '') + '" data-action="item-confirm" data-id="' + it.id + '"'
        + ' title="' + attr(it.needs_confirm ? 'Ya está confirmado: quitar la marca' : 'Marcar como pendiente de permiso o confirmación') + '">⏳</button>';
    const clase = [it.needs_confirm ? 'confirm' : '', org ? 'org' : ''].filter(Boolean).join(' ');
    return '<li data-item="' + it.id + '" data-day="' + day.id + '"' + (clase ? ' class="' + clase + '"' : '')
      + (org ? ' style="--org:' + ORG[org].color + '"' : '') + (ro ? '' : ' draggable="true"') + '>'
      + (ro ? '' : '<span class="grip" title="Arrastra para ordenar (también entre días)">⠿</span>')
      + time + dot + '<div class="body">' + body + '</div>' + flag
      + (ro ? '' : '<button class="link small" data-action="item-delete" data-id="' + it.id + '" title="Quitar de este día">✕</button>')
      + '</li>';
  }

  function pickerView(day) {
    const q = (state.picker.query || '').trim().toLowerCase();
    const scored = state.landmarks
      .filter((lm) => (q ? (lm.name + ' ' + lm.architect + ' ' + lm.city).toLowerCase().indexOf(q) >= 0 : lm.status !== 'descartado'))
      .sort((a, b) => (['curado', 'posible', 'pendiente', 'descartado'].indexOf(a.status) - ['curado', 'posible', 'pendiente', 'descartado'].indexOf(b.status))
        || a.name.localeCompare(b.name))
      .slice(0, 14);
    const hits = scored.map((lm) => {
      const inDays = daysOfLandmark(lm.id).map((d) => state.days.indexOf(d) + 1);
      return '<div class="hit" data-action="pick-landmark" data-day="' + day.id + '" data-id="' + lm.id + '">'
        + '<i class="dot" style="background:' + COLORS[lm.status] + '"></i>'
        + '<span><b>' + esc(lm.name) + '</b> <span class="muted">— ' + esc(lm.architect) + ', ' + esc(lm.city) + '</span></span>'
        + (inDays.length ? '<span class="in">ya está en el día ' + inDays.join(', ') + '</span>' : '') + '</div>';
    }).join('') || '<div class="muted small">ningún hito coincide</div>';
    return '<div class="picker"><input type="search" id="picker-input" placeholder="buscar hito por edificio, arquitecto o ciudad" value="'
      + attr(state.picker.query || '') + '" data-picker-input="1">'
      + '<div class="hits">' + hits + '</div>'
      + '<div class="small" style="margin-top:6px"><button class="link" data-action="picker-close">cerrar</button></div></div>';
  }

  function dayView(day, n) {
    const stops = state.stops.map((s) => '<option value="' + s.id + '"' + (day.stop_id === s.id ? ' selected' : '') + '>' + esc(s.city) + '</option>').join('');
    const head = STANDALONE
      ? '<div class="head"><span class="num">Día ' + n + '</span><b>' + esc(prettyDate(day.date) || day.date || '') + '</b>'
        + (day.title ? '<span>' + esc(day.title) + '</span>' : '')
        + (day.stop_city ? '<span class="when">base: ' + esc(day.stop_city) + '</span>' : '') + '</div>'
      : '<div class="head"><span class="num">Día ' + n + '</span>'
        + '<input type="date" value="' + attr(day.date || '') + '" data-day-field="date" data-id="' + day.id + '" title="Fecha">'
        + '<span class="when">' + esc(prettyDate(day.date)) + '</span>'
        + '<input class="title" type="text" value="' + attr(day.title || '') + '" placeholder="título (opcional): «llegada», «Nara → Kioto»…" data-day-field="title" data-id="' + day.id + '">'
        + '<select data-day-field="stop_id" data-id="' + day.id + '" title="Ciudad base / dónde se duerme"><option value="">— base —</option>' + stops + '</select>'
        + '<button class="link small" data-action="day-delete" data-id="' + day.id + '" title="Borrar el día">✕</button></div>';
    const notes = STANDALONE
      ? (day.notes ? '<div class="daynotes">' + esc(day.notes) + '</div>' : '')
      : '<input class="daynotes" type="text" value="' + attr(day.notes || '') + '" placeholder="nota del día (hotel, reservas, avisos…)" data-day-field="notes" data-id="' + day.id + '">';
    const items = (day.items || []).map((it) => itemView(it, day, n)).join('')
      || '<li class="empty muted">' + (STANDALONE ? 'sin nada planificado' : 'vacío: añade hitos o una nota') + '</li>';
    const foot = STANDALONE ? '' : '<div class="foot">'
      + '<button data-action="picker-open" data-id="' + day.id + '">＋ Hito</button>'
      + '<button class="quiet" data-action="item-note" data-id="' + day.id + '">＋ Nota</button>'
      + ((day.items || []).filter((it) => it.at_time).length > 1 ? '<button class="quiet" data-action="sort-by-time" data-id="' + day.id + '">ordenar por hora</button>' : '')
      + '</div>';
    return '<section class="dayc" data-day="' + day.id + '">' + head + notes + '<ul>' + items + '</ul>'
      + (state.picker && state.picker.dayId === day.id ? pickerView(day) : '') + foot + '</section>';
  }

  // El PDF con fotos tarda (baja una a una las fotos de Commons): se ve el avance y se puede parar.
  function pdfProgressView() {
    const p = state.pdf;
    if (!p) return '';
    if (p.error) return '<div class="msg err">' + esc(p.error) + ' <button class="link" data-action="pdf-dismiss">cerrar</button></div>';
    const pct = p.total ? Math.max(3, Math.round(100 * p.done / p.total)) : 100;
    const what = p.phase === 'fotos'
      ? 'Descargando fotos para el PDF… ' + p.done + ' de ' + p.total + ' (solo la primera vez: se guardan para las siguientes)'
      : 'Generando el PDF…';
    return '<div class="progress">' + what
      + ' <button class="link" data-action="pdf-cancel">cancelar</button>'
      + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  }

  async function downloadPhotoPdf() {
    if (state.pdf) return;
    state.pdf = { done: 0, total: 0, phase: 'fotos', cancel: false };
    renderList();
    try {
      for (let i = 0; i < 2000; i++) {
        const r = await store.photoNext(state.trip.id);
        if (state.pdf.cancel) { state.pdf = null; renderList(); return; }
        state.pdf.total = r.total;
        state.pdf.done = r.total - r.remaining;
        renderList();
        if (r.done) break;
      }
      state.pdf.phase = 'pdf';
      renderList();
      const res = await fetch('/api/trips/' + state.trip.id + '/export/itinerario?fotos=1');
      if (!res.ok) throw new Error('El servidor no ha podido generar el PDF (' + res.status + ')');
      const blob = await res.blob();
      if (state.pdf.cancel) { state.pdf = null; renderList(); return; }
      const name = (res.headers.get('Content-Disposition') || '').match(/filename=([^;]+)/);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name ? name[1].trim() : 'itinerario-fotos.pdf';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      state.pdf = null;
    } catch (e) {
      state.pdf = { error: e.message || 'No se ha podido preparar el PDF', done: 0, total: 0 };
    }
    renderList();
  }

  // ---- descubrir: qué más hay dentro del radio de acción del viaje (ver archtrip/discover.py)
  function discoverState() {
    if (!state.discover) {
      state.discover = { hours_env: 2, hours_halo: 1, include_posible: false,
        sources: ['arquitecturaviva', 'iwanbaan'],
        busy: false, error: null, area: null, candidates: null, chosen: {}, zone: 'todas', importing: false };
    }
    return state.discover;
  }

  const candKey = (c) => c.sources.join(',') + ':' + c.ref;

  function discoverBar(d) {
    const num = (field, label, title) => '<label title="' + attr(title) + '">' + label
      + ' <input type="number" min="0" max="6" step="0.5" value="' + d[field] + '" data-action="disc-hours" data-field="' + field + '"> h</label>';
    return '<div class="discbar">'
      + num('hours_env', 'Envolvente', 'Hasta dónde se puede llegar en coche desde una parada o desde un hito ya curado')
      + num('hours_halo', 'Desvío', 'Cuánto se admite desviarse de la carretera entre paradas (0 = solo la envolvente)')
      + '<span class="sep"></span>'
      + Object.keys(SOURCE_LABEL).map((src) => '<label class="check"><input type="checkbox" data-action="disc-source" data-src="' + src + '"'
        + (d.sources.indexOf(src) >= 0 ? ' checked' : '') + '> ' + SOURCE_LABEL[src] + '</label>').join('')
      + '<label class="check" title="Mide también desde los hitos marcados como «tal vez», no solo desde los curados">'
      + '<input type="checkbox" data-action="disc-posible"' + (d.include_posible ? ' checked' : '') + '> contar los «tal vez»</label>'
      + '<button data-action="disc-run"' + (d.busy ? ' disabled' : '') + '>' + (d.candidates ? '⟳ Buscar otra vez' : '🔍 Buscar') + '</button>'
      + '</div>';
  }

  function candView(c, chosen) {
    const pic = c.thumb
      ? '<img src="' + attr(c.thumb) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
      : '<div class="nopic"></div>';
    const meta = [c.city, c.year, c.drive_minutes != null ? minutesText(c.drive_minutes) + ' desde ' + (c.stop_city || '') : null]
      .filter(Boolean).map(esc).join(' · ');
    const links = c.sources.map((src, i) => {
      const url = i === 0 ? c.url : ((c.also || [])[i - 1] || {}).url;
      return url ? '<a href="' + attr(url) + '" target="_blank" rel="noopener">' + SOURCE_LABEL[src] + '</a>' : SOURCE_LABEL[src];
    }).join(' · ');
    return '<label class="cand' + (chosen ? ' on' : '') + '">'
      + '<input type="checkbox" data-action="disc-pick" data-key="' + attr(candKey(c)) + '"' + (chosen ? ' checked' : '') + '>'
      + pic + '<div class="cb"><div class="arch">' + esc(c.architect) + '</div>'
      + '<div class="name">' + esc(c.name) + '</div>'
      + '<div class="meta">' + meta + ' <span class="zone" title="' + attr(ZONE_HELP[c.zone] || '') + '">' + esc(ZONE_LABEL[c.zone] || c.zone) + '</span></div>'
      + '<div class="srcs">' + links + (c.sources.length > 1 ? ' <b>· en ' + c.sources.length + ' listas</b>' : '') + '</div>'
      + (c.dup_hint ? '<div class="srcs warn" title="Mismo arquitecto a menos de 2 km: puede ser la misma obra con otro nombre">'
        + '¿ya lo tienes? · ' + esc(c.dup_hint.name) + ' (' + esc(c.dup_hint.status) + ', a ' + c.dup_hint.km + ' km)</div>' : '')
      + '</div></label>';
  }

  // Lo mismo que enseña la ficha del candidato en la lista, para el popup del mapa: con la foto
  // delante se sabe de qué va la obra sin salir a abrir la fuente.
  function candPopup(c) {
    const pic = c.thumb
      ? (c.url ? '<a href="' + attr(c.url) + '" target="_blank" rel="noopener" title="Ver la ficha en ' + attr(SOURCE_LABEL[c.sources[0]]) + '">' : '')
        + '<img src="' + attr(c.thumb) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' + (c.url ? '</a>' : '')
      : '';
    const meta = [c.city, c.year, c.drive_minutes != null ? minutesText(c.drive_minutes) + ' desde ' + (c.stop_city || '') : null]
      .filter(Boolean).map(esc).join(' · ');
    const links = c.sources.map((src, i) => {
      const url = i === 0 ? c.url : ((c.also || [])[i - 1] || {}).url;
      return url ? '<a href="' + attr(url) + '" target="_blank" rel="noopener">' + SOURCE_LABEL[src] + '</a>' : SOURCE_LABEL[src];
    }).join(' · ');
    return '<div class="arch">' + esc(c.architect) + '</div><div>' + esc(c.name) + '</div>' + pic
      + '<div class="muted">' + meta + (meta ? ' · ' : '')
      + '<span class="zone" title="' + attr(ZONE_HELP[c.zone] || '') + '">' + esc(ZONE_LABEL[c.zone] || c.zone) + '</span></div>'
      + '<div class="muted small">' + links + (c.sources.length > 1 ? ' <b>· en ' + c.sources.length + ' listas</b>' : '') + '</div>'
      + (c.dup_hint ? '<div class="small warn">¿ya lo tienes? · ' + esc(c.dup_hint.name) + ' (' + esc(c.dup_hint.status) + ')</div>' : '')
      + '<div class="actions"><button data-action="disc-one" data-key="' + attr(candKey(c)) + '">＋ tal vez</button></div>';
  }

  function discoverView() {
    const d = discoverState();
    const intro = '<div class="muted small" style="margin:0 0 12px">Busca obras que caigan dentro del radio de acción del viaje: '
      + 'la <b>envolvente</b> (lo que está a unas horas en coche de una parada o de un hito ya curado) y el <b>desvío</b> '
      + 'admisible respecto a la carretera entre paradas. Las fuentes son el mapa de obras de <b>Arquitectura Viva</b> (selección '
      + 'editorial), el portfolio de <b>Iwan Baan</b> (no publica coordenadas: se sitúa por su ciudad) y <b>Wikidata</b> '
      + '(enciclopédico: trae mucho más, pero sin criterio — en un viaje a Japón son más de mil contra setenta y pico de '
      + 'Arquitectura Viva, así que viene apagado y conviene encenderlo solo para rellenar huecos). Nada se añade al viaje '
      + 'hasta que marques y pulses importar; entran como <b>tal vez</b>, para curarlos como el resto.</div>';
    let body = '';
    if (d.busy) {
      body = '<div class="progress">Preguntando a ' + d.sources.map((x) => SOURCE_LABEL[x]).join(', ')
        + '… (Wikidata tarda medio minuto la primera vez; después queda guardado)<div class="bar"><i style="width:100%"></i></div></div>';
    } else if (d.error) {
      body = '<div class="msg err">' + esc(d.error) + '</div>';
    } else if (d.candidates) {
      const a = d.area || {};
      const zones = ['todas'].concat(Object.keys(ZONE_LABEL).filter((z) => d.candidates.some((c) => c.zone === z)));
      const list = d.candidates.filter((c) => d.zone === 'todas' || c.zone === d.zone);
      const chosen = Object.keys(d.chosen).filter((k) => d.chosen[k]).length;
      const resumen = Object.keys(a.found || {}).map((src) => SOURCE_LABEL[src] + ': ' + a.found[src]).join(' · ');
      body = '<div class="muted small">En la zona (' + Math.round(a.radius_env_km) + ' km de envolvente, '
        + Math.round(a.radius_halo_km) + ' km de desvío) — ' + resumen + '. Quitando lo que ya está en el viaje quedan <b>'
        + a.candidates + '</b>'
        + (a.trimmed ? ', de los que se enseñan ' + a.shown + ' (Wikidata se recorta; afina las horas o apágala)' : '') + '.'
        + (a.places_left ? ' A Iwan Baan todavía le quedan lugares por situar (van de pocos en pocos, los más probables primero): vuelve a buscar para afinar la lista.' : '')
        + (Object.keys(a.errors || {}).length ? ' <b>No han contestado:</b> ' + Object.keys(a.errors).map((x) => SOURCE_LABEL[x]).join(', ') + '.' : '')
        + '</div>'
        + '<div class="discbar" style="margin-top:8px">'
        + zones.map((z) => '<button class="' + (d.zone === z ? 'on' : '') + '" data-action="disc-zone" data-zone="' + z + '">'
          + (z === 'todas' ? 'Todas' : ZONE_LABEL[z]) + ' '
          + (z === 'todas' ? d.candidates.length : d.candidates.filter((c) => c.zone === z).length) + '</button>').join('')
        + '<span class="sep"></span><button class="quiet" data-action="disc-all">Marcar las ' + list.length + '</button>'
        + '<button class="quiet" data-action="disc-none">Ninguna</button>'
        + '<span class="grow"></span><button data-action="disc-import"' + (chosen && !d.importing ? '' : ' disabled') + '>'
        + (d.importing ? 'Importando…' : '＋ Importar ' + (chosen || '') + ' como tal vez') + '</button></div>'
        + (list.length ? '<div class="cands">' + list.map((c) => candView(c, !!d.chosen[candKey(c)])).join('') + '</div>'
          : '<div class="empty">Nada en este grupo.</div>');
    }
    return '<div>' + discoverBar(d) + intro + body + '</div>';
  }

  async function runDiscover() {
    const d = discoverState();
    if (d.busy) return;
    if (!state.stops.some((st) => st.lat != null)) {
      d.error = 'Primero sube la ruta: sin paradas situadas no hay zona donde buscar.';
      renderList();
      return;
    }
    d.busy = true; d.error = null; renderList();
    try {
      const out = await store.discover(state.trip.id, { hours_env: d.hours_env, hours_halo: d.hours_halo,
        include_posible: d.include_posible, sources: d.sources, budget: 25 });
      d.candidates = out.candidates; d.area = out.area; d.chosen = {}; d.showZone = true;
      if (d.zone !== 'todas' && !out.candidates.some((c) => c.zone === d.zone)) d.zone = 'todas';
    } catch (e) {
      d.error = e.message || 'No se ha podido buscar';
    }
    d.busy = false; renderList();
  }

  async function importChosen() {
    const d = discoverState();
    const items = d.candidates.filter((c) => d.chosen[candKey(c)]);
    if (!items.length || d.importing) return;
    d.importing = true; renderList();
    try {
      const out = await store.discoverImport(state.trip.id, items);
      const added = out.added.length;
      // los hitos vienen enteros en la respuesta: se meten en su sitio sin recargar el viaje,
      // que es lo que antes reiniciaba el mapa (encuadre, zoom y popup abierto)
      (out.added || []).forEach(applyLandmark);
      if (out.pending) state.pending = out.pending;
      d.candidates = d.candidates.filter((c) => !d.chosen[candKey(c)]);
      d.chosen = {}; d.importing = false;
      state.msg = { kind: 'ok', text: added + (added === 1 ? ' hito importado' : ' hitos importados') + ' como tal vez'
        + (out.skipped.length ? ' (' + out.skipped.length + ' ya estaban)' : '')
        + '. Se les está buscando enlaces y tiempo en coche.' };
      renderList();
      runEnrich();
    } catch (e) {
      d.importing = false; d.error = e.message || 'No se han podido importar'; renderList();
    }
  }

  function itineraryView() {
    const bar = STANDALONE ? ''
      : '<div class="itinbar"><button data-action="day-add">＋ Añadir día</button>'
        + '<a class="btn quiet" href="/api/trips/' + state.trip.id + '/export/itinerario" download title="Un PDF día a día, listo para imprimir o mandar">⬇ PDF día a día</a>'
        + '<a class="btn quiet" href="/api/trips/' + state.trip.id + '/export/organizacion" download title="Sin fotos: el estado de cada gestión y el historial de actualizaciones, para llamar y dar seguimiento">⬇ PDF de organización</a>'
        + '<button class="quiet" data-action="pdf-fotos" title="El mismo itinerario con la foto de cada hito. La primera vez tarda: hay que descargar cada foto."'
        + (state.pdf ? ' disabled' : '') + '>⬇ PDF con fotos</button></div>'
        + pdfProgressView()
        + '<div class="muted small" style="margin:0 0 14px">Cada día lleva fecha, ciudad base y sus hitos con hora; arrastra ⠿ para ordenarlos o pasarlos a otro día. '
        + 'El punto de color dice cómo está curado cada hito (<span style="color:' + COLORS.curado + '">fijo</span>, '
        + '<span style="color:' + COLORS.posible + '">opcional</span>…) y ⏳ lo marca como pendiente de permiso o confirmación. '
        + 'El <b>color de la fila</b> es el estado de la gestión, que se pone desde <b>gestión</b> en cada hito.</div>'
        + '<div class="orglegend">' + Object.keys(ORG).map((k) => '<span style="color:' + ORG[k].color + '">■ ' + ORG[k].label + '</span>').join('') + '</div>';
    if (!state.days.length) {
      return '<div class="itin">' + bar + '<div class="empty">'
        + (STANDALONE ? 'Este viaje no tiene itinerario.' : 'Todavía no hay días. Pulsa <b>Añadir día</b>: el primero toma la fecha de hoy y los siguientes van encadenando el día siguiente.')
        + '</div></div>';
    }
    return '<div class="itin">' + bar + state.days.map((d, i) => dayView(d, i + 1)).join('') + '</div>';
  }

  function listView() {
    if (state.view === 'itinerario') return itineraryView();
    if (state.view === 'descubrir') return discoverView();
    const items = visibleLandmarks();
    const empty = emptyView(items);
    if (empty) return empty;
    const warn = state.filter === 'impreciso'
      ? '<div class="banner small">Estos hitos no están situados con precisión: el mapa usa el centro de su ciudad '
        + '(o no se encontraron). Ábrelos y usa <b>editar</b> para pegar latitud y longitud, o <b>Volver a localizar</b>.</div>'
      : '';
    if (state.view === 'fotos') {
      return warn + groups(items).map((g) => '<div class="group-head">' + groupTitle(g) + ' <span class="muted">· ' + g.items.length + '</span></div>'
        + '<div class="grid">' + g.items.map(cardView).join('') + '</div>').join('');
    }
    if (state.view === 'arquitectos') {
      return warn + architectGroups(items).map((g) => '<div class="group-head">' + esc(g.name) + ' <span class="muted">· ' + g.items.length + '</span></div>'
        + '<div class="grid">' + g.items.map(cardView).join('') + '</div>').join('');
    }
    return warn + groups(items).map((g) => '<div class="group-head">' + groupTitle(g) + ' <span class="muted">· ' + g.items.length + '</span></div>'
      + g.items.map(landmarkView).join('')).join('');
  }

  // ---- mapa (Leaflet, loaded on first use)
  let leafletPromise = null;
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const js = document.createElement('script'); js.src = src; js.onload = resolve; js.onerror = () => reject(new Error('No se ha podido cargar el mapa (¿sin conexión?)'));
      document.head.appendChild(js);
    });
  }
  function loadLeaflet() {
    if (window.L && window.L.markerClusterGroup) return Promise.resolve(window.L);
    if (leafletPromise) return leafletPromise;
    [LEAFLET_CSS, CLUSTER_CSS].forEach((href) => { const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = href; document.head.appendChild(css); });
    leafletPromise = loadScript(LEAFLET_JS).then(() => loadScript(CLUSTER_JS)).then(() => window.L)
      .catch((e) => { leafletPromise = null; throw e; });
    return leafletPromise;
  }

  // En modo fotos, la burbuja enseña las dos primeras fotos y cuántas hay detrás.
  function clusterPhotoIcon(cluster) {
    const markers = cluster.getAllChildMarkers();
    const conFoto = markers.filter((m) => m.options.thumb).slice(0, 2);
    const rest = markers.length - conFoto.length;   // con dos fotos y nada detrás, el «+0» sobra
    // de qué días es lo que hay aquí dentro: en un grupo se pierde el número de cada marcador
    const dias = [...new Set(markers.map((m) => m.options.day).filter(Boolean))].sort((a, b) => a - b);
    const lista = dias.length ? '<span class="d">' + (dias.length > 3 ? dias.slice(0, 3).join('·') + '…' : dias.join('·')) + '</span>' : '';
    const cuenta = conFoto.length ? (rest ? '+' + rest : '') : String(markers.length);
    const tag = (cuenta || lista) ? '<span>' + (cuenta ? '<span>' + cuenta + '</span>' : '') + lista + '</span>' : '';
    const html = '<div class="phcluster">'
      + conFoto.map((m) => '<i style="background-image:url(\'' + m.options.thumb + '\')">'
        + (m.options.day ? '<b>' + m.options.day + '</b>' : '') + '</i>').join('')
      + tag + '</div>';
    return L.divIcon({ html, className: '', iconSize: [36 * conFoto.length + (tag ? 30 : 0), 38], iconAnchor: [18, 19] });
  }

  // Cluster bubble: count in the middle, ring split by status colours.
  function clusterIcon(cluster) {
    if (state.mapPhotos) return clusterPhotoIcon(cluster);
    const markers = cluster.getAllChildMarkers();
    const counts = {};
    markers.forEach((m) => { counts[m.options.status] = (counts[m.options.status] || 0) + 1; });
    const total = markers.length, r = 15, cx = 18, cy = 18, C = 2 * Math.PI * r;
    let offset = 0, segs = '';
    Object.keys(COLORS).forEach((st) => {
      const n = counts[st] || 0;
      if (!n) return;
      const len = C * n / total;
      segs += '<circle r="' + r + '" cx="' + cx + '" cy="' + cy + '" fill="none" stroke="' + COLORS[st] + '" stroke-width="5" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      offset += len;
    });
    const html = '<svg width="36" height="36" viewBox="0 0 36 36"><circle r="' + r + '" cx="' + cx + '" cy="' + cy + '" fill="#fff"/>' + segs
      + '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle">' + total + '</text></svg>';
    return L.divIcon({ html, className: 'clusterico', iconSize: [36, 36], iconAnchor: [18, 18] });
  }

  function clusterListView(ids) {
    const items = ids.map((id) => state.landmarks.find((x) => x.id === id)).filter(Boolean);
    return '<div class="clusterlist">' + items.map((lm) => '<div class="item"><div class="arch">' + esc(lm.architect) + '</div>'
      + '<div>' + esc(lm.name) + ' <button class="link small" data-action="open" data-id="' + lm.id + '">ficha</button></div>'
      + '<div class="actions">' + statusButtons(lm, trashButton(lm)) + '</div></div>').join('') + '</div>';
  }

  function openClusterList(latlng, ids) {
    // openOn closes any previous popup first (which clears listPopup), so record it afterwards
    L.popup({ maxWidth: 320, className: 'clusterpopup' }).setLatLng(latlng).setContent(clusterListView(ids)).openOn(mapState.map);
    mapState.listPopup = { latlng, ids };
  }

  function popupView(lm) {
    const main = mainPhoto(lm);
    return '<div class="arch">' + esc(lm.architect) + '</div><div>' + esc(lm.name) + '</div>'
      + (main ? '<img src="' + attr(main.thumb) + '" alt="" data-action="open" data-id="' + lm.id + '">' : '')
      + '<div class="muted">' + driveText(lm) + '</div>'
      + '<div class="actions">' + statusButtons(lm, '<button class="link" data-action="open" data-id="' + lm.id + '">ficha</button>' + trashButton(lm)) + '</div>';
  }

  function renderMap() {
    const el = document.getElementById('list');
    if (!el) return;
    if (!document.getElementById('map')) {
      el.innerHTML = '<div id="map"></div><div class="legend" id="map-note"></div>';
      mapState.map = null; mapState.cluster = null; mapState.fitted = false; mapState.listPopup = null;
    }
    loadLeaflet().then((L) => {
      if (!document.getElementById('map') || state.view !== 'mapa') return;
      if (!mapState.map) {
        mapState.map = L.map('map', { zoomSnap: 0.5 });
        let chosen = Object.keys(BASEMAPS)[0];
        try { chosen = localStorage.getItem('archtrip:basemap') || chosen; } catch (e) { /* no storage */ }
        if (!BASEMAPS[chosen]) chosen = Object.keys(BASEMAPS)[0];
        const bases = {};
        Object.keys(BASEMAPS).forEach((name) => { const b = BASEMAPS[name]; bases[name] = L.tileLayer(b.url, { maxNativeZoom: b.native, maxZoom: 20, attribution: b.attribution }); });
        bases[chosen].addTo(mapState.map);
        L.control.layers(bases, null, { position: 'topright', collapsed: true }).addTo(mapState.map);
        mapState.map.on('baselayerchange', (e) => { try { localStorage.setItem('archtrip:basemap', e.name); } catch (x) { /* ignore */ } });
        mapState.layer = L.layerGroup().addTo(mapState.map);            // stops + route line, never clustered
        mapState.zone = L.layerGroup().addTo(mapState.map);              // envolvente + corredor + candidatos
        mapState.map.on('zoomend', () => { if (state.discover && state.discover.candidates) drawZone(window.L); });
        // landmarks cluster only when they really pile up (small radius); a small cluster opens a
        // list with curation buttons, a big one zooms in; identical spots spread out on max zoom
        mapState.cluster = newCluster(L);
        mapState.cluster.on('clusterclick', (e) => {
          const markers = e.layer.getAllChildMarkers();
          if (markers.length <= CLUSTER_LIST_MAX) openClusterList(e.layer.getLatLng(), markers.map((m) => m.options.landmarkId));
          else e.layer.zoomToBounds({ padding: [30, 30] });
        });
        mapState.map.on('popupclose', (e) => { if (e.popup && e.popup.options.className === 'clusterpopup') mapState.listPopup = null; });
      }
      updateMarkers(L);
    }).catch((e) => { el.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
  }

  // Las fotos sobre el mapa necesitan más aire entre burbujas que los puntos, o se tapan.
  function newCluster(L) {
    mapState.clusterPhotos = !!state.mapPhotos;
    return L.markerClusterGroup({ maxClusterRadius: state.mapPhotos ? 64 : 28, showCoverageOnHover: false,
      zoomToBoundsOnClick: false, spiderfyOnMaxZoom: true, spiderfyDistanceMultiplier: state.mapPhotos ? 2.6 : 1.4,
      iconCreateFunction: clusterIcon }).addTo(mapState.map);
  }

  // Un círculo con el color del estado: hueco si el hito no está en ningún día, y relleno con
  // el número del día si ya está colocado.
  const isWalk = (lm) => lm && lm.kind === 'paseo';

  function walkGeometry(lm) {
    if (!isWalk(lm) || !lm.geometry) return null;
    try { return typeof lm.geometry === 'string' ? JSON.parse(lm.geometry) : lm.geometry; } catch (e) { return null; }
  }

  // «2,4 km» se lee mejor que «2402 m» para decidir si un paseo cabe en una tarde
  function walkLength(lm) {
    if (!isWalk(lm) || !lm.length_m) return '';
    return lm.length_m >= 1000 ? (lm.length_m / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(lm.length_m) + ' m';
  }

  function landmarkIcon(L, lm, offRoute, placed) {
    if (state.mapPhotos) {
      const main = mainPhoto(lm), day = (placed || assignedDays()).get(lm.id);
      if (main && main.thumb) {
        return L.divIcon({ className: '', iconSize: [46, 34], iconAnchor: [23, 17],
          html: '<div class="phico' + (lm.kind === 'paseo' ? ' walk' : '') + '" style="border-color:' + (COLORS[lm.status] || '#111') + ';background-image:url(\''
            + main.thumb.replace(/'/g, '%27') + '\')">' + (day ? '<b>' + day + '</b>' : '') + '</div>' });
      }
    }
    const color = COLORS[lm.status] || '#111';
    const day = (placed || assignedDays()).get(lm.id);
    const fill = offRoute ? '#b3261e' : (day ? color : '#fff');
    return L.divIcon({ className: '', iconSize: [20, 20], iconAnchor: [10, 10],
      html: '<div class="lmicon' + (isWalk(lm) ? ' walk' : '') + '" style="border-color:' + color
        + ';background:' + fill + '">' + (day || '') + '</div>' });
  }

  function updateMarkers(L) {
    const layer = mapState.layer;
    layer.clearLayers();
    if (mapState.clusterPhotos !== !!state.mapPhotos) {    // el radio de agrupación cambia con el modo
      mapState.map.removeLayer(mapState.cluster);
      const prev = mapState.cluster;
      mapState.cluster = newCluster(L);
      prev.off();
      mapState.cluster.on('clusterclick', (e) => {
        const markers = e.layer.getAllChildMarkers();
        if (markers.length <= CLUSTER_LIST_MAX) openClusterList(e.layer.getLatLng(), markers.map((m) => m.options.landmarkId));
        else e.layer.zoomToBounds({ padding: [30, 30] });
      });
    }
    mapState.cluster.clearLayers();
    mapState.markers = {};
    const items = visibleLandmarks();
    const shown = items.filter(located);
    const pts = [];
    state.stops.filter((s) => s.lat != null).forEach((s) => {
      // hangs up-left of the exact point and sits under the landmark bubbles, so a stop never hides a cluster
      L.marker([s.lat, s.lon], { icon: L.divIcon({ className: '', html: '<div class="stopicon">' + s.position + '</div>', iconSize: [22, 20], iconAnchor: [24, 22] }), zIndexOffset: -1000 })
        .bindTooltip(s.position + '. ' + s.city).addTo(layer);
      pts.push([s.lat, s.lon]);
    });
    const routePts = state.stops.filter((s) => s.lat != null).map((s) => [s.lat, s.lon]);
    if (routePts.length > 1) L.polyline(routePts, { color: '#111', weight: 1.5, dashArray: '4 6', opacity: .6 }).addTo(layer);
    // a landmark more than ~150 km from every stop is almost certainly mis-located:
    // keep it on the map (so it can be spotted) but don't let it drive the zoom
    const km = (a, b) => { const r = Math.PI / 180, x = Math.sin((b[0] - a[0]) * r / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); };
    let far = 0;
    const placed = assignedDays();
    // el recorrido de los paseos, debajo de los marcadores: el punto es la entrada y la línea
    // enseña por dónde va; se pinta con el color de su curado
    shown.filter(isWalk).forEach((lm) => {
      const geo = walkGeometry(lm);
      if (!geo) return;
      const linea = L.geoJSON(geo, { style: { color: COLORS[lm.status] || '#111', weight: 4, opacity: .75 } });
      linea.bindTooltip(lm.architect + ' — ' + lm.name + (walkLength(lm) ? ' · ' + walkLength(lm) : ''), { sticky: true });
      linea.on('click', () => { if (mapState.markers[lm.id]) mapState.markers[lm.id].openPopup(); });
      linea.addTo(layer);
    });
    shown.forEach((lm) => {
      const p = [lm.lat, lm.lon];
      const offRoute = routePts.length > 0 && routePts.every((s) => km(s, p) > 150);
      // relleno con el número del día si ya está colocado; hueco si todavía no
      const main = mainPhoto(lm);
      const m = L.marker(p, { icon: landmarkIcon(L, lm, offRoute, placed), status: lm.status, landmarkId: lm.id,
                              offRoute: offRoute, riseOnHover: true, thumb: main ? main.thumb : null,
                              day: placed.get(lm.id) || null });
      mapState.markers[lm.id] = m;
      m.bindTooltip(lm.architect + ' — ' + lm.name + (offRoute ? ' (¿mal localizado?)' : ''));
      m.bindPopup(() => popupView(state.landmarks.find((x) => x.id === lm.id) || lm), { maxWidth: 280 });
      mapState.cluster.addLayer(m);
      if (offRoute) far++; else pts.push(p);
    });
    if (!mapState.fitted && pts.length) { mapState.map.fitBounds(pts, { padding: [30, 30] }); mapState.fitted = true; }
    if (mapState.listPopup) {   // a list popup was open: keep it, refreshed, for the items still on the map
      const ids = mapState.listPopup.ids.filter((id) => shown.some((lm) => lm.id === id));
      if (ids.length) openClusterList(mapState.listPopup.latlng, ids); else { mapState.map.closePopup(); mapState.listPopup = null; }
    }
    drawZone(L);
    const hidden = items.length - shown.length;
    const legend = '<label class="check" title="Enseña la foto de cada hito sobre su punto; las que se juntan salen en grupo con un +N">'
      + '<input type="checkbox" data-action="map-photos"' + (state.mapPhotos ? ' checked' : '') + '> fotos en el mapa</label>'
      + Object.keys(COLORS).map((s) => '<span><i style="background:' + COLORS[s] + '"></i>' + FILTER_LABEL[s] + '</span>').join('')
      + (state.days.length ? '<span title="El número es el día del itinerario al que está asignado"><i class="hollow"></i>sin día<i class="filled" style="margin-left:10px"></i>día 1, 2, 3…</span>' : '');
    const off = shown.length && pts.length ? shown.filter((lm) => !mapState.map.getBounds().contains([lm.lat, lm.lon])).length : 0;
    document.getElementById('map-note').innerHTML = legend
      + '<button class="link" data-action="fit-map" title="Encuadra el mapa sobre lo que se está mostrando">ajustar vista</button>'
      + '<span class="muted">' + shown.length + ' hitos en el mapa'
      + (off ? ' · ' + off + ' fuera del encuadre actual' : '')
      + (hidden ? ' · ' + hidden + ' sin localizar con precisión no se muestran (ver Lista)' : '')
      + (far ? ' · <span class="warn">' + far + ' muy lejos de la ruta (relleno rojo): probablemente mal localizados, corrígelos con editar</span>' : '') + '</span>'
      + (state.discover && state.discover.candidates ? '<span><i class="hollow" style="border-color:#2a6ca8"></i>'
        + '<label class="check" title="La envolvente, el corredor y los candidatos de la búsqueda de Descubrir">'
        + '<input type="checkbox" data-action="disc-zone-map"' + (state.discover.showZone ? ' checked' : '') + '> '
        + state.discover.candidates.length + ' candidatos y su zona</label></span>' : '');
  }

  // La envolvente (discos de N horas alrededor de paradas e hitos curados), el corredor a lo
  // largo de la carretera y los candidatos de la última búsqueda. Dibujarlo es lo que hace
  // entendible el criterio: se ve de un vistazo por qué algo entra o no.
  function drawZone(L) {
    if (!mapState.map || !mapState.zone) return;
    mapState.zone.clearLayers();
    const d = state.discover;
    if (!d || !d.candidates || !d.area || !d.showZone) return;
    const a = d.area;
    (a.centre_points || []).forEach((c) => {
      L.circle(c, { radius: a.radius_env_km * 1000, color: '#2a6ca8', weight: 0, fillColor: '#2a6ca8',
                    fillOpacity: .05, interactive: false }).addTo(mapState.zone);
    });
    if ((a.road || []).length > 1) {
      // el ancho del corredor son kilómetros, no píxeles: se recalcula en cada zoom
      const lat = mapState.map.getCenter().lat;
      const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, mapState.map.getZoom());
      // el trazo se recorta contra el lienzo de Leaflet si es enorme, y entonces se ve el borde
      // del recorte como un rectángulo: por encima de ~140 px el corredor ya ocupa la pantalla
      const px = Math.min(140, Math.max(2, 2 * a.radius_halo_km * 1000 / mpp));
      L.polyline(a.road, { color: '#2a6ca8', weight: px, opacity: .07, interactive: false }).addTo(mapState.zone);
      L.polyline(a.road, { color: '#2a6ca8', weight: 1, opacity: .5, interactive: false }).addTo(mapState.zone);
    }
    const zone = d.zone === 'todas' ? null : d.zone;
    d.candidates.filter((c) => (!zone || c.zone === zone) && c.zone !== 'pais').forEach((c) => {
      const m = L.marker([c.lat, c.lon], {
        icon: L.divIcon({ className: '', html: '<div class="candico' + (c.sources.length > 1 ? ' dos' : '') + '"></div>',
                          iconSize: [11, 11], iconAnchor: [6, 6] }), zIndexOffset: -500,
      });
      m.bindTooltip(c.architect + ' — ' + c.name + ' · ' + c.sources.map((x) => SOURCE_LABEL[x]).join(' + '));
      m.bindPopup(candPopup(c), { maxWidth: 280 });
      m.addTo(mapState.zone);
    });
  }

  // Reorder pictures by dragging thumbnails (within the same strip: photos or drawings).
  function wireDrag(lm) {
    const imgs = Array.from(document.querySelectorAll('#detail .strip img[draggable]'));
    let dragged = null;
    imgs.forEach((el) => {
      el.addEventListener('dragstart', (e) => { dragged = el; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', el.dataset.img); } catch (x) { /* ie */ } });
      el.addEventListener('dragend', () => { el.classList.remove('dragging'); imgs.forEach((x) => x.classList.remove('over')); });
      el.addEventListener('dragover', (e) => { e.preventDefault(); if (dragged && dragged !== el) el.classList.add('over'); });
      el.addEventListener('dragleave', () => el.classList.remove('over'));
      el.addEventListener('drop', async (e) => {
        e.preventDefault();
        if (!dragged || dragged === el) return;
        const all = pictures(lm).filter((p) => p.id != null);
        const from = all.findIndex((p) => String(p.id) === dragged.dataset.img), to = all.findIndex((p) => String(p.id) === el.dataset.img);
        if (from < 0 || to < 0) return;
        const moved = all.splice(from, 1)[0];
        all.splice(to, 0, moved);   // kinds stay separate: the server orders by kind first, then position
        try {
          applyLandmark(await store.orderImages(lm.id, all.map((p) => p.id)));
          state.detailImg = pictures(state.landmarks.find((x) => x.id === lm.id)).findIndex((p) => p.id === moved.id);
          patchCard(state.landmarks.find((x) => x.id === lm.id)); renderDetail();
        } catch (err) { fail(err); renderDetail(); }
      });
    });
  }

  function openDetail(id) { state.detail = id; state.detailImg = 0; state.addingImage = false; renderDetail(); syncHash(); }

    const next = list[idx + delta];
    if (next) openDetail(next.id);
  }
