<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archTrip</title>
<style>
  :root {
    --ink: #111; --muted: #666; --line: #d8d8d8; --bg: #fff; --soft: #f4f4f4;
    --ok: #2e7d4f; --maybe: #b8860b; --bad: #999; --warn: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Courier New", Courier, monospace; font-size: 15px; line-height: 1.45;
         padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  body.locked { overflow: hidden; }
  a { color: var(--ink); }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 1px; text-transform: uppercase; }
  h2 { font-size: 15px; margin: 28px 0 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  button, .btn, input, textarea {
    font-family: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
  }
  button, .btn {
    border: 1px solid var(--ink); padding: 6px 12px; cursor: pointer; text-decoration: none;
    display: inline-block; line-height: 1.2; background: var(--bg);
  }
  button:hover, .btn:hover { background: var(--soft); }
  button:disabled { opacity: .45; cursor: default; }
  button.link { border: 0; padding: 0; text-decoration: underline; background: none; font-size: inherit; }
  button.link:hover { background: none; color: var(--muted); }
  button.quiet, .btn.quiet { border-color: var(--line); }
  button.danger { border-color: var(--warn); color: var(--warn); }
  button.on { color: var(--bg); }
  button.on.curado { background: var(--ok); border-color: var(--ok); }
  button.on.posible { background: var(--maybe); border-color: var(--maybe); }
  button.on.descartado { background: var(--bad); border-color: var(--bad); }
  input[type=text], input[type=number], textarea { border: 1px solid var(--line); padding: 6px 8px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 200px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 12px 0; }
  .toolbar .group { display: flex; flex-wrap: wrap; gap: 8px; }

  .msg { border: 1px solid var(--line); padding: 10px 12px; margin: 12px 0; background: var(--soft); }
  .msg.err { border-color: var(--warn); }
  .msg ul { margin: 6px 0 0; padding-left: 20px; }
  .progress { margin: 10px 0; }
  .bar { height: 6px; background: var(--soft); border: 1px solid var(--line); margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--ink); }

  .route { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-start; }
  .route .stop { white-space: nowrap; }
  .route .stop b { font-weight: normal; text-transform: uppercase; }
  /* con foto: la parada pasa a ser una tarjetita */
  .route .card2 { width: 130px; white-space: normal; border: 1px solid var(--line); }
  .route .card2 .pic { display: block; height: 72px; background: var(--soft); overflow: hidden; position: relative; }
  .route .card2 .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .route .card2 .pic .nopic { font-size: 11px; color: var(--muted); display: flex; height: 100%;
                              align-items: center; justify-content: center; text-align: center; padding: 0 6px; }
  .route .card2 .cap { padding: 4px 6px; font-size: 12px; display: flex; gap: 4px; align-items: baseline; }
  .route .card2 .cap b { font-weight: normal; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  .route .card2 .tools { padding: 0 6px 5px; font-size: 11px; display: flex; gap: 8px; }
  .route .arrow { align-self: center; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 18px 0 10px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { border-color: var(--line); }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .views { display: flex; gap: 0; margin-left: auto; }
  .views button { border-color: var(--line); }
  .views button + button { border-left: 0; }
  .views button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #search { max-width: 320px; }

  .group-head { margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--ink);
                text-transform: uppercase; letter-spacing: 1px; }
  .group-head .muted { text-transform: none; letter-spacing: 0; }
  .warn { color: var(--warn); }
  .ok { color: var(--ok); }
  .approx { cursor: help; border-bottom: 1px dotted var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* ---- lista */
  .lm { border: 1px solid var(--line); border-left: 6px solid var(--line); padding: 12px 14px;
        margin: 0 0 10px; display: flex; gap: 14px; }
  .lm.curado, .card.curado { border-left-color: var(--ok); }
  .lm.posible, .card.posible { border-left-color: var(--maybe); }
  .lm.descartado, .card.descartado { border-left-color: var(--bad); opacity: .6; }
  .lm .body { flex: 1 1 auto; min-width: 0; }
  .lm .arch, .card .arch, .dside .arch { font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: .5px; }
  .lm .name, .card .name, .dside .name { font-size: 18px; }
  .lm .meta, .card .meta { color: var(--muted); margin-top: 4px; }
  .lm .links { margin-top: 6px; }
  .links a, .links button { margin-right: 14px; }
  .lm .actions { margin-top: 10px; }
  .lm .thumb { flex: 0 0 140px; }
  .lm .thumb img { width: 140px; height: 105px; object-fit: cover; border: 1px solid var(--line); display: block; cursor: zoom-in; }
  .notes { margin-top: 6px; white-space: pre-wrap; }

  /* ---- fotos */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-left: 6px solid var(--line); background: var(--bg); display: flex; flex-direction: column; }
  .card .pic { display: block; position: relative; aspect-ratio: 4 / 3; background: var(--soft); overflow: hidden; cursor: zoom-in; text-decoration: none; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .nopic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .card .badge { position: absolute; right: 6px; bottom: 6px; background: rgba(255,255,255,.9); border: 1px solid var(--line); font-size: 12px; padding: 1px 6px; }
  .card .cbody { padding: 8px 10px 10px; }
  .card .arch { font-size: 14px; }
  .card .name { font-size: 15px; line-height: 1.3; }
  .card .meta { font-size: 12px; margin-top: 2px; }
  .card .actions { margin-top: 8px; gap: 6px; }
  .card .actions button { padding: 4px 8px; font-size: 12.5px; }

  /* ---- descubrir */
  .cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .cand { border: 1px solid var(--line); display: flex; gap: 9px; padding: 8px; align-items: flex-start; cursor: pointer; }
  .cand.on { border-color: var(--ink); background: var(--soft); }
  .cand img, .cand .nopic { width: 92px; height: 69px; flex: none; object-fit: cover; background: var(--soft); }
  .cand .cb { flex: 1; min-width: 0; }
  .cand .arch { font-size: 13px; }
  .cand .name { font-size: 14px; line-height: 1.25; }
  .cand .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cand .srcs { font-size: 11.5px; margin-top: 3px; }
  .cand input { margin: 2px 0 0; }
  .zone { border: 1px solid var(--line); padding: 0 4px; font-size: 11px; white-space: nowrap; }
  .candico { width: 11px; height: 11px; background: var(--bg); border: 2px solid #2a6ca8; transform: rotate(45deg); }
  /* fotos sobre el mapa */
  .phico { width: 46px; height: 34px; border: 2px solid var(--ink); background: var(--soft) center/cover no-repeat; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .phico b { position: absolute; right: -6px; bottom: -6px; min-width: 14px; height: 14px; line-height: 14px; text-align: center; font-size: 10px; background: var(--ink); color: var(--bg); border-radius: 7px; padding: 0 2px; }
  .phcluster { display: flex; box-shadow: 0 1px 3px rgba(0,0,0,.4); border: 2px solid var(--ink); background: var(--bg); }
  .phcluster i { width: 36px; height: 34px; background: var(--soft) center/cover no-repeat; display: block; position: relative; }
  .phcluster i b { position: absolute; right: 1px; bottom: 1px; min-width: 13px; height: 13px; line-height: 13px;
                   text-align: center; font-size: 9.5px; background: var(--ink); color: var(--bg); border-radius: 7px; padding: 0 2px; }
  .phcluster span { font-size: 11px; padding: 0 5px; background: var(--ink); color: var(--bg);
                    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
  .phcluster span .d { font-size: 9.5px; opacity: .9; white-space: nowrap; }
  .candico.dos { background: #2a6ca8; }
  .discbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .discbar input[type=number] { width: 52px; font-family: inherit; font-size: 13px; }
  .discbar .sep { border-left: 1px solid var(--line); height: 20px; }
  .discbar button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---- mapa */
  #map { height: 72vh; min-height: 420px; border: 1px solid var(--line); background: var(--soft); }
  .stopicon { background: var(--ink); color: var(--bg); border-radius: 2px; font: bold 12px/20px "Courier New", monospace; text-align: center; width: 22px; height: 20px; }
  .leaflet-popup-content { font-family: "Courier New", Courier, monospace; font-size: 13px; margin: 10px 12px; min-width: 200px; }
  .leaflet-control-layers { font-family: "Courier New", Courier, monospace; font-size: 13px; border-radius: 0; }
  .leaflet-control-layers-expanded { padding: 8px 12px 8px 8px; }
  .leaflet-control-layers label { display: block; margin: 3px 0; }
  .leaflet-popup-content .arch { font-weight: bold; text-transform: uppercase; }
  .leaflet-popup-content img { width: 100%; height: 120px; object-fit: cover; margin: 6px 0; display: block; cursor: zoom-in; }
  .leaflet-popup-content .actions { margin-top: 6px; gap: 5px; }
  .leaflet-popup-content .actions button { padding: 3px 7px; font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 13px; }
  /* un paseo se distingue de un edificio por la forma del marcador: cuadrado contra círculo */
  .lmicon.walk { border-radius: 3px; }
  .phico.walk { border-radius: 3px; outline: 1px dashed rgba(255,255,255,.7); outline-offset: -3px; }
  .lmicon { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #111; background: #fff;
            display: flex; align-items: center; justify-content: center; box-sizing: border-box;
            font: bold 10px "Courier New", Courier, monospace; color: #fff; letter-spacing: -.5px;
            box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .clusterico { background: none; border: 0; }
  .clusterico svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .clusterico text { font: bold 12px "Courier New", monospace; fill: #111; }
  .clusterlist { max-height: 300px; overflow: auto; }
  .clusterlist .item { padding: 6px 0; border-top: 1px solid var(--line); }
  .clusterlist .item:first-child { border-top: 0; padding-top: 0; }
  .clusterlist .arch { font-weight: bold; text-transform: uppercase; }
  .clusterlist .actions { margin-top: 4px; gap: 5px; }
  .clusterlist .actions button { padding: 3px 7px; font-size: 12px; }
  .leaflet-popup-content.wide { min-width: 260px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .legend i.hollow { background: var(--bg) !important; border: 2px solid var(--muted); width: 8px; height: 8px; }
  .legend i.filled { background: var(--muted) !important; border: 2px solid var(--muted); width: 8px; height: 8px; }

  /* ---- ficha (detalle) */
  .detail { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; padding: 14px 20px; overflow: auto; }
  .dhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
  .dmain { display: flex; gap: 20px; flex: 1 1 auto; min-height: 0; margin-top: 12px; }
  .dviewer { flex: 1 1 60%; min-width: 0; display: flex; flex-direction: column; }
  .dviewer .stage { flex: 1 1 auto; min-height: 320px; background: var(--soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .dviewer .stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .dviewer .caption { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 18px; }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .strip .lab { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; width: 100%; }
  .strip img { width: 84px; height: 63px; object-fit: cover; border: 2px solid transparent; cursor: pointer; display: block; }
  .strip img.on { border-color: var(--ink); }
  .strip img.dragging { opacity: .4; }
  .strip img.over { outline: 2px dashed var(--ink); outline-offset: 1px; }
  .bigbtns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .bigbtns .btn { font-size: 15px; padding: 9px 14px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .check input { margin: 0; }
  .trash { border: 0; background: none; padding: 2px 6px; font-size: 16px; line-height: 1; cursor: pointer; color: var(--warn); }
  .trash:hover { background: var(--soft); }
  .dside { flex: 0 0 360px; max-width: 40%; overflow: auto; }
  .dside .actions { margin: 12px 0; }
  .dside .actions button { font-size: 15px; padding: 8px 14px; }
  .keys { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .keys kbd { border: 1px solid var(--line); padding: 0 4px; font-family: inherit; }
  .dnav { display: flex; gap: 8px; align-items: center; margin-left: auto; }

  .edit { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .edit .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 12px; }
  .edit label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .edit .wide { grid-column: 1 / -1; }

  .trips li { list-style: none; padding: 10px 0; border-bottom: 1px solid var(--line);
              display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .trips ul { padding: 0; margin: 0; }
  .trips .name { font-size: 17px; text-transform: uppercase; flex: 1 1 200px; }
  .tag.local { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--bg);
               background: var(--maybe); padding: 2px 6px; vertical-align: middle; }
  .empty { padding: 30px 0; color: var(--muted); }
  .choices { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
  .choice { flex: 1 1 280px; border: 1px solid var(--line); padding: 16px; cursor: pointer; background: var(--bg); text-align: left; }
  .choice.on, .choice.on b { border-color: var(--ink); background: var(--soft); color: var(--ink); }
  .choice b { display: block; font-size: 16px; margin-bottom: 4px; }
  .steps { border: 1px solid var(--line); padding: 16px; margin-top: 12px; }
  .steps h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px; color: var(--muted); }
  .steps h3:first-child { margin-top: 0; }
  .promptbox { border: 1px solid var(--line); background: var(--soft); padding: 14px 16px; margin-top: 10px;
               white-space: pre-wrap; font-style: italic; font-size: 13px; line-height: 1.5; max-height: 60vh; overflow: auto; }
  #credits { margin-top: 48px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
             display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  #credits .brand { letter-spacing: 1px; text-transform: uppercase; }
  #credits a { color: var(--muted); display: inline-flex; align-items: center; text-decoration: none; }
  #credits a:hover { color: var(--ink); }
  .banner { background: var(--soft); border: 1px dashed var(--line); padding: 8px 12px; margin-bottom: 12px; }
  /* barra para asignar hitos a un día sin salir de fotos, mapa o lista */
  .daybar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px;
            border: 1px solid var(--line); border-left: 3px solid var(--ink); padding: 6px 10px; }
  .daybar.off { border-left-color: var(--line); padding: 3px 10px; }
  .daybar.off .lab { color: var(--muted); }
  .daybar .fold { border: 0; background: none; padding: 0 2px; color: var(--muted); cursor: pointer; font-size: 13px; }
  .daybar .fold:hover { color: var(--ink); background: none; }
  .daybar .lab { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .daybar button { font-size: 12px; padding: 3px 8px; }
  .daybar button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button.dayadd { border-style: dashed; }
  button.dayadd.on { background: var(--ink); color: var(--bg); border-color: var(--ink); border-style: solid; }
  /* itinerario: días con fecha, hitos ordenados y notas sueltas */
  .controls.itin #tabs, .controls.itin #search { display: none; }
  .itin .itinbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .dayc { border: 1px solid var(--line); border-left: 3px solid var(--ink); margin-bottom: 14px; }
  .dayc > .head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 10px; background: var(--soft); }
  .dayc .num { text-transform: uppercase; letter-spacing: 1px; font-size: 12px; color: var(--muted); min-width: 52px; }
  .dayc .head input, .dayc .head select { font-family: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .dayc .head input.title { flex: 1 1 160px; min-width: 120px; }
  .dayc .head .when { font-size: 12px; color: var(--muted); }
  .dayc .daynotes { width: 100%; font-family: inherit; font-size: 13px; padding: 5px 8px; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .dayc ul { list-style: none; margin: 0; padding: 0; }
  .dayc li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .dayc li.over { border-top: 2px solid var(--ink); }
  .dayc li.dragging { opacity: .4; }
  .dayc li .grip { cursor: grab; color: var(--muted); user-select: none; padding-top: 2px; }
  .dayc li input[type=time] { width: 92px; font-family: inherit; font-size: 13px; padding: 3px 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .dayc li .body { flex: 1 1 auto; min-width: 0; }
  .dayc li .body .arch { text-transform: uppercase; font-weight: bold; font-size: 13px; }
  .dayc li .body .meta { font-size: 12px; color: var(--muted); }
  .dayc li textarea.note { width: 100%; font-family: inherit; font-size: 13px; font-style: italic; padding: 4px 6px;
                           border: 1px solid transparent; background: var(--bg); color: var(--ink); resize: vertical; min-height: 26px; }
  .dayc li textarea.note:hover, .dayc li textarea.note:focus { border-color: var(--line); }
  .dayc .foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 7px 10px; }
  .dayc .foot button { font-size: 12px; padding: 3px 8px; }
  .dayc .empty { padding: 10px; }
  .dayc li .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; margin-top: 5px; }
  .dayc li.confirm { background: #fff8f7; }
  .dayc li .flag { font-size: 11px; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted);
                   background: var(--bg); cursor: pointer; white-space: nowrap; }
  .dayc li .flag.on { color: var(--warn); border-color: var(--warn); }
  .dayc li .tag { font-size: 11px; letter-spacing: .5px; }
  /* gestión de la visita: el color de la fila lo pone el estado de organización */
  .dayc li.org { border-left: 4px solid var(--org); padding-left: 6px; background: color-mix(in srgb, var(--org) 7%, transparent); }
  .orgtag { font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--org); }
  .orgbox { width: 100%; margin-top: 6px; padding: 7px 9px; border: 1px solid var(--line); background: var(--soft); }
  .orgbox .row { gap: 6px; }
  .orgbox select, .orgbox input { font-family: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .orgbox select { max-width: 200px; }
  .orgbox ul { list-style: none; margin: 7px 0 0; padding: 0; font-size: 12px; }
  .orgbox ul li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; border: 0; }
  .orgbox ul li .when { color: var(--muted); white-space: nowrap; }
  .orgbox ul li.old { color: var(--muted); }
  /* el comentario se lee en el color de su gestión, oscurecido para que contraste con el fondo
     teñido de la fila; la etiqueta del estado se queda con el color puro */
  .orglast { font-size: 12px; margin-top: 3px; color: color-mix(in srgb, var(--org, #555) 72%, #000); }
  .orglast .when { color: var(--muted); margin-right: 6px; white-space: nowrap; }
